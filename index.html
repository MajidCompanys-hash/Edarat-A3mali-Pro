<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">

<link rel="icon" type="image/png" href="icons/icon-192.png">

<title>إدارة أعمالي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: registry ledger — header with company switch, single scrolling column, bottom tab bar on phone / side rail on wide screens */
:root{
  --bg:#f2f4f1;--surface:#ffffff;--surface-2:#e8ede9;--ink:#16231f;--muted:#5b6a63;--line:#d4dcd7;
  --brand:#1e4b41;--brand-ink:#ffffff;--accent:#a8741a;
  --ok:#2e7a4d;--warn:#a96d12;--bad:#b3372e;--info:#2b678c;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1613;--surface:#15201c;--surface-2:#1c2924;--ink:#e4ebe7;--muted:#97a69f;--line:#293732;
  --brand:#5cae99;--brand-ink:#08120f;--accent:#d8a243;--ok:#5bc189;--warn:#e2aa4a;--bad:#ee7b70;--info:#6eb0d6;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1613;--surface:#15201c;--surface-2:#1c2924;--ink:#e4ebe7;--muted:#97a69f;--line:#293732;
  --brand:#5cae99;--brand-ink:#08120f;--accent:#d8a243;--ok:#5bc189;--warn:#e2aa4a;--bad:#ee7b70;--info:#6eb0d6;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.3}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.sp{flex:1}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;white-space:nowrap}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;opacity:.75;margin-top:-2px}
.co-sel{min-width:0;flex:1;max-width:260px;background:color-mix(in srgb,var(--brand-ink) 14%,transparent);border:1px solid color-mix(in srgb,var(--brand-ink) 25%,transparent);color:var(--brand-ink);border-radius:10px;padding:7px 10px;font-size:13px}
.co-sel option{color:#16231f;background:#fff}
.sync{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid color-mix(in srgb,var(--brand-ink) 30%,transparent);color:var(--brand-ink);border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:color-mix(in srgb,var(--brand-ink) 45%,transparent)}
.dot.on{background:#7fe0a8}.dot.busy{background:#f1c76a;animation:pulse 1s infinite}.dot.err{background:#ff8f86}
@keyframes pulse{50%{opacity:.35}}
/* shell */
.shell{max-width:1100px;margin:0 auto;display:flex;gap:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px}
.rail{display:none}
main{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px}
.nav{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav button{background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
.nav button.on{color:var(--brand);font-weight:600}
.nav svg{width:22px;height:22px}
@media (min-width:900px){
  .nav{display:none}
  .rail{display:flex;flex-direction:column;gap:4px;width:200px;flex-shrink:0;position:sticky;top:80px;align-self:flex-start}
  .rail button{display:flex;align-items:center;gap:10px;background:none;border:0;padding:10px 12px;border-radius:10px;color:var(--muted);cursor:pointer;text-align:right;font-size:14px}
  .rail button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset -3px 0 0 var(--brand)}
  .rail svg{width:20px;height:20px}
  .shell{padding-block:24px 40px}
}
/* blocks */
.page-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-h h1{font-size:24px}
.page-h p{margin:2px 0 0;color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h2{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:right;cursor:default}
button.stat{cursor:pointer}
.stat .lbl{font-size:12px;color:var(--muted);letter-spacing:.01em}
.stat .val{font-family:var(--f-display);font-size:22px;font-weight:600}
.stat.bad .val{color:var(--bad)}.stat.warn .val{color:var(--warn)}.stat.ok .val{color:var(--ok)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);background:none;border-inline:0;border-top:0;width:100%;text-align:right;cursor:pointer}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;background:var(--surface-2);color:var(--brand)}
.ico svg{width:20px;height:20px}
.pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.pill.info{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.amt-in{color:var(--ok);font-weight:600}.amt-out{color:var(--ink);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row-end{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;cursor:pointer}
.quick svg{width:22px;height:22px;color:var(--brand)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:14px}
.demo-note{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px dashed color-mix(in srgb,var(--accent) 55%,transparent);border-radius:var(--r);padding:10px 14px;font-size:13.5px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.chart-wrap{overflow-x:auto}
.chart-wrap svg{display:block;width:100%;min-width:300px;height:auto}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;vertical-align:-1px}
.insight{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.insight:last-child{border-bottom:0}
.insight .mk{width:4px;border-radius:4px;flex-shrink:0;background:var(--info)}
.insight.bad .mk{background:var(--bad)}.insight.warn .mk{background:var(--warn)}.insight.ok .mk{background:var(--ok)}
.insight .t{font-weight:600}.insight .s{font-size:13px;color:var(--muted)}
.score{display:flex;align-items:center;gap:14px}
.score .big{font-family:var(--f-display);font-size:34px;font-weight:700}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.thumb{aspect-ratio:3/4;max-width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden;cursor:pointer;padding:0;font-size:11px;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:28px;height:28px;color:var(--bad)}
/* modal */
.scrim{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet.wide{max-width:900px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet h2{font-size:19px}
.form{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:13px;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.fld textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.viewer img{width:100%;border-radius:10px}
.viewer iframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:10px;background:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:pan-x pan-y}
body{overscroll-behavior-y:contain;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y}
button,a,label,.item,.chip,.folder,.fcard{touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,select,textarea,.search{font-size:16px!important}
main.anim-next{animation:slideN .24s cubic-bezier(.2,.8,.2,1)}main.anim-prev{animation:slideP .24s cubic-bezier(.2,.8,.2,1)}main.anim-fade{animation:fadeIn .2s ease-out}
@keyframes slideN{from{opacity:.35;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes slideP{from{opacity:.35;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:.4}to{opacity:1}}
.sheet{animation:sheetUp .22s cubic-bezier(.2,.8,.2,1)}@keyframes sheetUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.hbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:transparent;border:1px solid color-mix(in srgb,var(--brand-ink) 30%,transparent);color:var(--brand-ink);cursor:pointer;padding:0}
.hbtn svg{width:19px;height:19px}
@media (max-width:480px){.brand small{display:none}.brand{font-size:16px}.sync .st{max-width:84px;overflow:hidden;text-overflow:ellipsis}}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:19;transform:translate(-50%,-70px);display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--brand);font-size:13px;font-weight:600;box-shadow:0 6px 18px color-mix(in srgb,#000 14%,transparent);opacity:0;pointer-events:none}
.ptr svg{width:18px;height:18px}.ptr.spin svg{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.tip{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--info) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--info) 28%,transparent);border-radius:var(--r);padding:11px 12px;font-size:13.5px}
.tip>svg{width:20px;height:20px;color:var(--info);flex-shrink:0;margin-top:2px}
.tip .x{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:2px 4px}
.drive{display:flex;align-items:center;gap:12px}
.drive .ico{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.drive.on .ico{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.folder{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:right;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.folder svg{width:30px;height:30px;color:var(--accent)}
.folder .t{font-weight:600;overflow-wrap:anywhere;font-size:14px}.folder .s{font-size:12px;color:var(--muted)}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.crumbs button{background:none;border:0;color:var(--brand);cursor:pointer;padding:2px 0;font-weight:600}
.crumbs span{color:var(--muted)}
.fname-row{display:flex;gap:8px;align-items:center}.fname-row input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
.ob{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.ob-card{max-width:420px;display:flex;flex-direction:column;align-items:center;gap:16px;animation:fadeIn .25s ease-out}
.ob-ill{width:104px;height:104px;border-radius:30px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.ob-ill svg{width:52px;height:52px}
.ob h2{font-size:24px}.ob p{margin:0;color:var(--muted);font-size:16px;line-height:1.8}
.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:99px;background:var(--line)}.dots i.on{width:22px;background:var(--brand)}
.ob .skip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px}
.gstep{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gstep>summary{list-style:none;display:flex;gap:12px;align-items:center;padding:13px 14px;cursor:pointer}
.gstep>summary::-webkit-details-marker{display:none}
.gnum{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;flex-shrink:0;font-size:14px}
.gstep.done .gnum{background:var(--ok);border-color:var(--ok);color:#fff}
.gstep.done .gt{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent);color:var(--muted)}
.gt{font-weight:600}.gsub{font-size:12.5px;color:var(--muted)}
.gbody{padding:0 14px 14px 14px;display:flex;flex-direction:column;gap:10px;font-size:14px;border-top:1px solid var(--line);padding-top:12px}
.gbody h4{margin:0;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.01em}
.gbody ul{margin:0;padding-inline-start:20px}.gbody li{margin:2px 0}
.gbody a{color:var(--info);overflow-wrap:anywhere}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;text-align:right;cursor:pointer}
.fcard .ico{width:42px;height:42px}
.fcard .t{font-weight:600;font-family:var(--f-display)}.fcard .s{font-size:13px;color:var(--muted)}
.steps{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.disclaimer{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.demo-note>svg{width:20px;height:20px;flex-shrink:0;color:var(--accent)}
.item,.ov-row{flex-wrap:wrap}.item .main,.ov-row .main{flex:1 1 150px;min-width:140px}.ov-row .mini{flex:1 1 100%;justify-content:flex-start;padding-inline-start:50px}
.tip b{margin-left:4px}
@media (max-width:560px){.top-in{flex-wrap:wrap;row-gap:8px}.co-sel{order:9;flex:1 1 100%;max-width:none}}
.focus{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--brand) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--brand) 35%,transparent);border-radius:var(--r);padding:10px 12px;font-size:13.5px}
.focus>svg{width:20px;height:20px;color:var(--brand);flex-shrink:0}
.ov-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);background:none;border-inline:0;border-top:0;width:100%;text-align:right;cursor:pointer}
.ov-row:last-child{border-bottom:0}.ov-row .main{flex:1;min-width:0}.ov-row .t{font-weight:600;overflow-wrap:anywhere}.ov-row .s{font-size:12.5px;color:var(--muted)}
.mini{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.about{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-block:22px}
.about .mono{width:64px;height:64px;border-radius:20px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:26px;margin-bottom:6px}
.about .nm{font-family:var(--f-display);font-size:19px;font-weight:700}
.about .rl{color:var(--muted);font-size:13.5px}

/* ========== storage (IndexedDB with memory fallback) ========== */
const MEM={kv:{},files:{}};let IDB=null;
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open("idarat-a3mali",1);r.onupgradeneeded=()=>{r.result.createObjectStore("kv");r.result.createObjectStore("files")};r.onsuccess=()=>{IDB=r.result;res()};r.onerror=()=>res()}catch(e){res()}})}
function tx_(store,mode,fn){return new Promise((res,rej)=>{try{const t=IDB.transaction(store,mode),s=t.objectStore(store),r=fn(s);t.oncomplete=()=>res(r?r.result:undefined);t.onerror=()=>rej(t.error)}catch(e){rej(e)}})}
async function kvGet(k){if(!IDB)return MEM.kv[k];try{return await tx_("kv","readonly",s=>s.get(k))}catch(e){return MEM.kv[k]}}
async function kvSet(k,v){MEM.kv[k]=v;if(IDB)try{await tx_("kv","readwrite",s=>s.put(v,k))}catch(e){}}
async function fileGet(id){if(MEM.files[id])return MEM.files[id];if(!IDB)return null;try{return await tx_("files","readonly",s=>s.get(id))}catch(e){return null}}
async function filePut(id,b){MEM.files[id]=b;if(IDB)try{await tx_("files","readwrite",s=>s.put(b,id))}catch(e){}}
async function fileDel(id){delete MEM.files[id];if(IDB)try{await tx_("files","readwrite",s=>s.delete(id))}catch(e){}}
async function fileKeys(){if(!IDB)return Object.keys(MEM.files);try{return await tx_("files","readonly",s=>s.getAllKeys())}catch(e){return Object.keys(MEM.files)}}

/* ========== state ========== */

function emptyDB(){return{v:1,companies:[],docs:[],employees:[],tx:[],bills:[],projects:[],folders:[],files:[],del:{},settings:{alertDays:60,guide:{},sector:"trade",u:0}}}
function normalizeDB(db){const e=emptyDB();if(!db||typeof db!=="object")return e;for(const c of COLL)if(!Array.isArray(db[c]))db[c]=[];if(!db.del||typeof db.del!=="object")db.del={};
  db.settings={...e.settings,...(db.settings||{})};if(!db.settings.guide||typeof db.settings.guide!=="object")db.settings.guide={};db.v=e.v;return db}
function stripDemo(db){const r=normalizeDB(JSON.parse(JSON.stringify(db)));for(const c of COLL)r[c]=r[c].filter(x=>!String(x.id).startsWith("demo-"));delete r.demo;return r}
async function save(){S.db.u=now();await kvSet("db",S.db);scheduleSync()}
async function saveLocal(){await kvSet("local",S.local);await kvSet("sync",S.sync)}
const focusP=()=>String(S.local.co||"").startsWith("p:")?S.local.co.slice(2):"";

const coList=()=>{const c=S.local.co||"all";if(c==="all")return S.db.companies;const pid=focusP();const cid=pid?(projById(pid)||{}).companyId:c;return S.db.companies.filter(x=>x.id===cid)};
const scopeName=()=>{const c=S.local.co||"all";if(c==="all")return"كل الشركات والمشاريع";const pid=focusP();return pid?"مشروع «"+((projById(pid)||{}).name||"")+"»":coName(c)};
function inAll(fn){const k=S.local.co;S.local.co="all";try{return fn()}finally{S.local.co=k}}
const empOf=id=>S.db.employees.find(e=>e.id===id)||{};
const projDocs=pid=>S.db.docs.filter(d=>d.projectId===pid||(d.ownerType==="employee"&&empOf(d.ownerId).projectId===pid));
const coName=id=>(S.db.companies.find(c=>c.id===id)||{}).name||"—";
const empName=id=>(S.db.employees.find(e=>e.id===id)||{}).name||"—";
function upsert(coll,rec){rec.u=now();const a=S.db[coll],i=a.findIndex(x=>x.id===rec.id);if(i>=0)a[i]=rec;else a.push(rec);return rec}
function remove(coll,id){S.db[coll]=S.db[coll].filter(x=>x.id!==id);S.db.del[id]=now()}

/* document status */
function docStatus(d){const n=daysTo(d.expiry);if(n===null)return{k:"",cls:"",txt:"بلا تاريخ انتهاء",n:9e9};
  if(n<0)return{k:"expired",cls:"bad",txt:`منتهي منذ ${-n} يوم`,n};
  if(n===0)return{k:"soon",cls:"bad",txt:"ينتهي اليوم",n};
  if(n<=30)return{k:"soon",cls:"warn",txt:`باقٍ ${n} يوم`,n};
  if(n<=(S.db.settings.alertDays||60))return{k:"upcoming",cls:"info",txt:`باقٍ ${n} يوم`,n};
  return{k:"ok",cls:"ok",txt:"ساري",n}}
const ownerLabel=d=>d.ownerType==="employee"?empName(d.ownerId):d.ownerType==="project"?"مشروع: "+((projById(d.projectId)||{}).name||"—"):coName(d.companyId);

/* bills status for current month */
function billStatus(b){const cur=ym(new Date());if(b.lastPaid===cur)return{k:"paid",cls:"ok",txt:"مدفوعة هذا الشهر"};
  const day=new Date().getDate();const due=Math.min(+b.dueDay||1,28);
  if(day>due)return{k:"overdue",cls:"bad",txt:`متأخرة منذ ${day-due} يوم`};
  if(due-day<=5)return{k:"due",cls:"warn",txt:due===day?"تستحق اليوم":`تستحق بعد ${due-day} يوم`};
  return{k:"later",cls:"",txt:`تستحق يوم ${due}`}}

/* ========== image compression ========== */
function compressImage(file){return new Promise(res=>{if(!file.type.startsWith("image/")||file.size<350000)return res(file);
  const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const mx=1800;let{width:w,height:h}=img;const r=Math.min(1,mx/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
    c.toBlob(b=>res(b&&b.size<file.size?new File([b],file.name.replace(/\.\w+$/,"")+".jpg",{type:"image/jpeg"}):file),"image/jpeg",.82)};
  img.onerror=()=>{URL.revokeObjectURL(url);res(file)};img.src=url})}
async function storeFiles(list){const out=[];for(const f of list){const b=await compressImage(f);const id="f"+uid();await filePut(id,b);out.push({id,name:f.name,mime:b.type||f.type,size:b.size})}return out}

/* reports */
function buckets(per){const out=[];const d=new Date();d.setHours(0,0,0,0);
  if(per==="day"){for(let i=13;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-i);const s=ymd(x);out.push({l:String(x.getDate()),a:s,b:s})}}
  else if(per==="week"){const st=new Date(d);st.setDate(d.getDate()-d.getDay());for(let i=7;i>=0;i--){const a=new Date(st);a.setDate(st.getDate()-7*i);const b=new Date(a);b.setDate(a.getDate()+6);out.push({l:a.getDate()+"/"+(a.getMonth()+1),a:ymd(a),b:ymd(b)})}}
  else if(per==="month"){for(let i=11;i>=0;i--){const a=new Date(d.getFullYear(),d.getMonth()-i,1),b=new Date(d.getFullYear(),d.getMonth()-i+1,0);out.push({l:MONTHS[a.getMonth()],a:ymd(a),b:ymd(b)})}}
  else{for(let i=4;i>=0;i--){const y=d.getFullYear()-i;out.push({l:String(y),a:y+"-01-01",b:y+"-12-31"})}}
  return out.map(x=>({...x,...sumRange(x.a,x.b)}))}
function niceMax(v){if(v<=0)return 100;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function barChart(bk){const W=640,H=240,L=56,R=10,T=12,B=28;const mx=niceMax(Math.max(...bk.map(b=>Math.max(b.i,b.o)),1));const iw=W-L-R,ih=H-T-B;const bw=iw/bk.length;const g=Math.max(2,bw*.14);const w=(bw-g*3)/2;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="الدخل والمصروفات" style="direction:ltr">`;
  for(let k=0;k<=4;k++){const v=mx*k/4,y=T+ih-ih*k/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v>=1000?(v/1000).toLocaleString("en-US",{maximumFractionDigits:1})+"k":Math.round(v)}</text>`}
  bk.forEach((b,i)=>{const x=L+i*bw+g;const hi=ih*b.i/mx,ho=ih*b.o/mx;
    s+=`<rect x="${x}" y="${T+ih-hi}" width="${w}" height="${Math.max(hi,0)}" rx="2" fill="var(--brand)"><title>دخل ${money(b.i)}</title></rect><rect x="${x+w+g}" y="${T+ih-ho}" width="${w}" height="${Math.max(ho,0)}" rx="2" fill="var(--accent)"><title>مصروف ${money(b.o)}</title></rect><text x="${L+i*bw+bw/2}" y="${H-9}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(b.l)}</text>`});
  return s+`</svg>`}
VIEWS.reports=()=>{const per=S.f.per||"month";const bk=buckets(per);const cur=bk[bk.length-1],prev=bk[bk.length-2]||{i:0,o:0,n:0};
  const names={day:["يومي","اليوم","أمس"],week:["أسبوعي","هذا الأسبوع","الأسبوع الماضي"],month:["شهري","هذا الشهر","الشهر الماضي"],year:["سنوي","هذه السنة","السنة الماضية"]};
  const cats={};txF().forEach(t=>{if(t.kind==="out"&&t.date>=cur.a&&t.date<=cur.b)cats[t.category]=(cats[t.category]||0)+ +t.amount});const ce=Object.entries(cats).sort((a,b)=>b[1]-a[1]);const ct=ce.reduce((s,x)=>s+x[1],0);
  const byCo=coList().map(c=>{let i=0,o=0;S.db.tx.forEach(t=>{if(t.companyId===c.id&&t.date>=cur.a&&t.date<=cur.b){t.kind==="in"?i+=+t.amount:o+=+t.amount}});return{c,i,o}});
  const ch=v=>`<button class="chip${per===v?" on":""}" data-act="per" data-v="${v}">${names[v][0]}</button>`;
  const delta=(a,b)=>b?` <span class="muted" style="font-size:12px">(${a>=b?"+":""}${Math.round((a-b)/b*100)}% عن ${names[per][2]})</span>`:"";

function finInsights(){const out=[];const[a,b]=monthRange(0),[pa,pb]=monthRange(-1);const c=sumRange(a,b),p=sumRange(pa,pb);
  const day=new Date().getDate(),dim=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();
  if(c.i||c.o){if(c.o>c.i)out.push(["bad","المصروفات تتجاوز الدخل هذا الشهر",`العجز حاليًا ${money(c.o-c.i)} ر.ع. راجع البنود الأكبر أو أجّل المشتريات غير الضرورية حتى يتحسن الدخل.`]);
    else out.push(["ok",`هامش الربح هذا الشهر ${c.i?Math.round(c.n/c.i*100):0}%`,`الصافي ${money(c.n)} ر.ع حتى اليوم ${day} من ${dim}. هامش فوق 20% يعتبر صحيًا لمعظم الأنشطة التجارية الصغيرة.`])}
  if(p.o&&c.o){const proj=c.o/day*dim;const ch=(proj-p.o)/p.o*100;if(ch>15)out.push(["warn",`المصروفات تسير نحو زيادة ${Math.round(ch)}%`,`بالوتيرة الحالية سيصل مصروف الشهر إلى نحو ${money(proj)} ر.ع مقابل ${money(p.o)} الشهر الماضي.`])}
  const cats={};txF().forEach(t=>{if(t.kind==="out"&&t.date>=pa&&t.date<=b)cats[t.category]=(cats[t.category]||0)+ +t.amount});const tot=Object.values(cats).reduce((s,x)=>s+x,0);const top=Object.entries(cats).sort((x,y)=>y[1]-x[1])[0];
  if(top&&tot&&top[1]/tot>.4)out.push(["warn",`«${top[0]}» تستهلك ${Math.round(top[1]/tot*100)}% من المصروفات`,`تركّز المصروف في بند واحد يرفع المخاطرة. ابحث عن بدائل أو تفاوض على السعر في هذا البند أولًا.`]);
  const od=S.db.bills.filter(coOk).filter(x=>billStatus(x).k==="overdue");if(od.length)out.push(["bad",`${od.length} فاتورة ثابتة متأخرة`,od.map(x=>x.name+" ("+money(x.amount)+")").join("، ")+". التأخير في الكهرباء والماء قد يسبب قطع الخدمة أو غرامات."]);
  const fixed=S.db.bills.filter(coOk).reduce((s,x)=>s+ +x.amount,0);const sal=S.db.employees.filter(coOk).reduce((s,e)=>s+(+e.salary||0),0);
  let inc3=0;for(let k=1;k<=3;k++){const[x,y]=monthRange(-k);inc3+=sumRange(x,y).i}inc3/=3;
  if(fixed+sal)out.push(["info",`الالتزامات الشهرية الثابتة ${money(fixed+sal)} ر.ع`,`تشمل الرواتب ${money(sal)} والفواتير ${money(fixed)}${inc3?`، وتمثل ${Math.round((fixed+sal)/inc3*100)}% من متوسط الدخل لآخر 3 أشهر`:""}. يُنصح باحتياطي نقدي يغطي 3 أشهر منها: ${money((fixed+sal)*3)} ر.ع.`]);
  S.db.projects.filter(coOk).forEach(pr=>{const sp=projSpent(pr);if(pr.budget&&sp/pr.budget>=.85&&pr.status!=="مكتمل")out.push([sp>pr.budget?"bad":"warn",`مشروع «${pr.name}» استهلك ${Math.round(sp/pr.budget*100)}% من ميزانيته`,`نسبة الإنجاز ${pr.progress||0}% فقط. راجع التكاليف المتبقية قبل تجاوز الميزانية.`])});
  if(!out.length)out.push(["info","لا توجد بيانات كافية بعد","سجّل الدخل والمصروفات لبضعة أسابيع ليبدأ المستشار بإعطاء توصيات دقيقة."]);return out}
function fileInsights(){const out=[];const docs=docsF();const st=docs.map(d=>({d,s:docStatus(d)}));
  const ex=st.filter(x=>x.s.k==="expired");if(ex.length)out.push(["bad",`${ex.length} مستند منتهي يحتاج تجديدًا فورًا`,ex.slice(0,5).map(x=>`${x.d.type} — ${ownerLabel(x.d)}`).join("، ")+". العمل بسجل أو تصريح منتهٍ قد يعرّض الشركة لمخالفات."]);
  const so=st.filter(x=>x.s.k==="soon");if(so.length)out.push(["warn",`${so.length} مستند ينتهي خلال 30 يومًا`,so.slice(0,5).map(x=>`${x.d.type} — ${ownerLabel(x.d)} (${x.s.n} يوم)`).join("، ")+". ابدأ إجراءات التجديد الآن لتجنب التأخير."]);
  S.db.employees.filter(coOk).forEach(e=>{const miss=REQUIRED_EMP.filter(t=>!S.db.docs.some(d=>d.ownerId===e.id&&d.type===t));if(miss.length)out.push(["warn",`ملف ${e.name} ناقص`,`لا يوجد: ${miss.join("، ")}.`])});
  coList().forEach(c=>{const has=t=>S.db.docs.some(d=>d.companyId===c.id&&d.ownerType==="company"&&d.type===t);const miss=["سجل تجاري","شهادة التسجيل الضريبي"].filter(t=>!has(t));if(miss.length)out.push(["warn",`${c.name}: مستندات أساسية غير مسجلة`,miss.join("، ")+"."])});
  const noAtt=docs.filter(d=>!(d.files||[]).length).length;if(noAtt)out.push(["info",`${noAtt} مستند بدون نسخة مرفقة`,"أرفق صورة أو PDF لكل مستند لتستخرجه بسرعة عند الحاجة من أي جهاز."]);
  if(!out.length)out.push(["ok","الملفات مكتملة ومحدّثة","كل المستندات سارية ولها مرفقات."]);return out}
function healthScore(){const docs=docsF();if(!docs.length)return 100;const ok=docs.filter(d=>{const k=docStatus(d).k;return k==="ok"||k===""||k==="upcoming"}).length;const att=docs.filter(d=>(d.files||[]).length).length;return Math.round((ok/docs.length)*80+(att/docs.length)*20)}

/* ========== merge (per record, newest wins, deletions tracked) ========== */
function mergeDB(a,b){const r=emptyDB();r.del={...(a.del||{})};for(const[k,v]of Object.entries(b.del||{}))r.del[k]=Math.max(r.del[k]||0,v);
  for(const c of COLL){const m=new Map();for(const x of a[c]||[])m.set(x.id,x);for(const x of b[c]||[]){const y=m.get(x.id);if(!y||(x.u||0)>(y.u||0))m.set(x.id,x)}
    r[c]=[...m.values()].filter(x=>!(r.del[x.id]>=(x.u||0)))}
  r.settings=((b.settings||{}).u||0)>((a.settings||{}).u||0)?b.settings:a.settings;if(a.demo&&b.demo)r.demo=true;return r}

/* ========== Google Drive sync (encrypted, appDataFolder) ========== */
const SCOPE="https://www.googleapis.com/auth/drive.appdata";const MAIN="idarat-a3mali-db.enc";
let syncTimer=null;
function setSync(s){S.syncState=s;const b=document.querySelector(".sync .dot");if(b){b.className="dot "+(s==="on"?"on":s==="busy"?"busy":s==="err"?"err":"");b.parentNode.querySelector(".st").textContent=SYNC_TXT[s]}}
function scheduleSync(){if(!S.sync.connected)return;if(S.token&&S.tokenExp>now()){clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(true),3500)}else setSync("wait")}
async function deriveKey(pass,salt){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function enc(buf){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const k=await deriveKey(S.sync.pass,salt);const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,buf));const out=new Uint8Array(28+ct.length);out.set(salt);out.set(iv,16);out.set(ct,28);return out}
async function dec(buf){const a=new Uint8Array(buf);const k=await deriveKey(S.sync.pass,a.slice(0,16));return crypto.subtle.decrypt({name:"AES-GCM",iv:a.slice(16,28)},k,a.slice(28))}
function loadGIS(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=()=>res();s.onerror=()=>rej(new Error("gis"));document.head.appendChild(s)})}
async function getToken(interactive){if(S.token&&S.tokenExp>now()+60000)return S.token;await loadGIS();return new Promise((res,rej)=>{const c=google.accounts.oauth2.initTokenClient({client_id:S.sync.clientId,scope:SCOPE,callback:r=>{if(r.error)return rej(new Error(r.error));S.token=r.access_token;S.tokenExp=now()+(r.expires_in||3600)*1000;res(S.token)},error_callback:e=>rej(new Error(e.type||"popup"))});c.requestAccessToken({prompt:interactive&&!S.sync.connected?"consent":""})})}
async function gfetch(url,opt={}){const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:"Bearer "+S.token}});if(!r.ok)throw new Error("drive "+r.status);return r}
async function findFile(name){const q=encodeURIComponent(`name='${name}'`);const r=await gfetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,name)&pageSize=10`);return((await r.json()).files||[])[0]}
async function uploadFile(name,bytes,id){if(id){await gfetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{method:"PATCH",headers:{"Content-Type":"application/octet-stream"},body:bytes});return id}
  const fd=new FormData();fd.append("metadata",new Blob([JSON.stringify({name,parents:["appDataFolder"]})],{type:"application/json"}));fd.append("file",new Blob([bytes],{type:"application/octet-stream"}));
  const r=await gfetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",body:fd});return(await r.json()).id}
async function download(id){const r=await gfetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);return r.arrayBuffer()}
async function drivePullFile(fid){const f=await findFile("f_"+fid+".enc");if(!f)return null;const plain=new Uint8Array(await dec(await download(f.id)));const tl=plain[0];const type=new TextDecoder().decode(plain.slice(1,1+tl));return new Blob([plain.slice(1+tl)],{type})}
async function syncNow(silent){if(!S.sync.clientId||!S.sync.pass){if(!silent){S.view="prefs";render();toast("أدخل معرّف العميل وكلمة التشفير أولًا")}return}
  if(S.syncState==="busy")return;setSync("busy");
  try{await getToken(!silent);
    const f=await findFile(MAIN);let remote=null;
    if(f){try{remote=JSON.parse(new TextDecoder().decode(await dec(await download(f.id))))}catch(e){throw new Error("pass")}}
    if(remote){const local=S.db.demo&&!remote.demo?stripDemo(S.db):S.db;S.db=mergeDB(local,normalizeDB(remote));if(!(local.demo&&remote.demo))delete S.db.demo;await kvSet("db",S.db)}
    await uploadFile(MAIN,await enc(new TextEncoder().encode(JSON.stringify(S.db))),f&&f.id);
    const used=new Set([...S.db.docs.flatMap(d=>(d.files||[]).map(x=>x.id)),...S.db.files.map(x=>x.meta&&x.meta.id).filter(Boolean)]);const done=new Set(S.sync.synced);
    for(const k of await fileKeys()){if(!used.has(k)||done.has(k))continue;const b=await fileGet(k);if(!b)continue;const t=new TextEncoder().encode(b.type||"application/octet-stream");const raw=new Uint8Array(await b.arrayBuffer());const p=new Uint8Array(1+t.length+raw.length);p[0]=t.length;p.set(t,1);p.set(raw,1+t.length);
      const ex=await findFile("f_"+k+".enc");await uploadFile("f_"+k+".enc",await enc(p),ex&&ex.id);done.add(k)}
    S.sync.synced=[...done];S.sync.connected=true;S.sync.lastSync=now();await saveLocal();setSync("on");
    if(!silent||remote)render();if(!silent)toast("تمت المزامنة مع Google Drive")}
  catch(e){setSync("err");const m=String(e.message||e);if(!silent)toast(m==="pass"?"كلمة التشفير لا تطابق البيانات المحفوظة في Drive":m==="gis"?"تعذر تحميل خدمة Google. هذه الميزة تعمل من نسخة GitHub Pages فقط.":m.includes("popup")?"تم إغلاق نافذة تسجيل الدخول":"تعذرت المزامنة: "+m)}}

function showTour(){closeModal();let i=0;const el=document.createElement("div");el.className="ob";el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");document.body.appendChild(el);
  const end=async(goGuide)=>{el.remove();S.local.onboarded=true;await saveLocal();if(goGuide)go("guide");else if(S.db.demo)toast("هذه بيانات تجريبية للتوضيح. احذفها من الشريط الأصفر عندما تكون جاهزًا.",5000)};
  const draw=()=>{const[ic,t,d]=TOUR[i];const last=i===TOUR.length-1;
    el.innerHTML=`<button class="skip" data-ob="skip">تخطي</button><div class="ob-card" key="${i}"><div class="ob-ill">${I[ic]}</div><h2>${t}</h2><p>${d}</p></div>
    <div class="dots">${TOUR.map((_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</div>
    <div class="row" style="justify-content:center">${i?`<button class="btn" data-ob="prev">السابق</button>`:""}${last?`<button class="btn" data-ob="guide">${I.compass} ابدأ بدليل التأسيس</button><button class="btn primary" data-ob="done">ابدأ الاستخدام</button>`:`<button class="btn primary" data-ob="next">التالي</button>`}</div>`};
  el.addEventListener("click",e=>{const b=e.target.closest("[data-ob]");if(!b)return;const k=b.dataset.ob;if(k==="next"&&i<TOUR.length-1)i++;else if(k==="prev"&&i>0)i--;else if(k==="skip"||k==="done")return end(false);else if(k==="guide")return end(true);draw()});
  let sx=null;el.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
  el.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)<50)return;if(dx>0&&i<TOUR.length-1)i++;else if(dx<0&&i>0)i--;draw()},{passive:true});
  draw();el.querySelector("[data-ob]").focus()}

const coOkLoose=r=>{const c=S.local.co||"all";if(c==="all")return true;const pid=focusP();if(pid)return r.projectId===pid;return!r.companyId||r.companyId===c};

function libFileName(f,b){const ext=b.type==="application/pdf"?".pdf":b.type.startsWith("image/")?(b.type.includes("png")?".png":".jpg"):((f.meta.name||"").match(/\.[a-z0-9]{2,5}$/i)||[""])[0];return(f.name+ext).replace(/[\\/:*?"<>|]/g,"-")}
const folderName=id=>(S.db.folders.find(x=>x.id===id)||{}).name||"";
function folderPath(id){const out=[];let cur=S.db.folders.find(x=>x.id===id);let guard=0;while(cur&&guard++<20){out.unshift(cur);cur=S.db.folders.find(x=>x.id===cur.parentId)}return out}
function folderOpts(){const out=[["","ملفاتي (الرئيسي)"]];const walk=(pid,depth)=>{S.db.folders.filter(f=>(f.parentId||"")===pid).sort((a,b)=>a.name.localeCompare(b.name,"ar")).forEach(f=>{out.push([f.id,"— ".repeat(depth+1)+f.name]);if(depth<6)walk(f.id,depth+1)})};walk("",0);return out}
const kb=n=>n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";

   {k:"note",label:"ملاحظة (اختياري)",val:f.note,ph:"مثال: موقّع من العميل"}],
   onSave:async v=>{if(isNew){if(!(S.pending||[]).length)return toast("اختر ملفًا أو صوّر ورقة أولًا");const names=[...document.querySelectorAll(".fname")].map(x=>x.value.trim());const metas=await storeFiles(S.pending);
      metas.forEach((m,i)=>{upsert("files",{id:uid(),name:names[i]||baseName(m.name),folderId:v.folderId,companyId:v.companyId,projectId:v.projectId||"",note:v.note,meta:m,date:today()})});
      await save();closeModal();S.f.files={...(S.f.files||{}),folder:v.folderId,q:""};if(S.view!=="files"&&S.view!=="proj")go("files");else render();toast(`تم حفظ ${metas.length} ملف في «${folderName(v.folderId)||"ملفاتي"}». اضغط على أي ملف لعرضه أو مشاركته.`,4200)}
     else{upsert("files",{...f,...v});await save();closeModal();render();toast("تم حفظ التعديل")}},
   onDelete:f.id&&(()=>ask("حذف هذا الملف نهائيًا؟",async()=>{await fileDel(f.meta.id);remove("files",f.id);await save();closeModal();render()}))});
  if(isNew)S.form.base=f;if(isNew)setTimeout(()=>{const n=$("#f_names");if(n)n.innerHTML='<span class="muted" style="font-size:12.5px">بعد الاختيار تظهر هنا خانة لتسمية كل ملف.</span>'},0)}
async function openLib(id){const f=S.db.files.find(x=>x.id===id);if(!f)return;const b=await getBlob(f.meta.id);if(b)S.blobs[f.meta.id]=b;
  const u=b?URL.createObjectURL(b):"";const isImg=b&&b.type.startsWith("image/"),isPdf=b&&b.type==="application/pdf";

  <div class="viewer"${u?` data-url="${u}"`:""}>${!b?`<div class="empty">الملف غير موجود على هذا الجهاز بعد. اسحب الشاشة للأسفل للمزامنة ثم أعد فتحه.</div>`:isImg?`<img src="${u}" alt="${esc(f.name)}">`:isPdf?`<iframe src="${u}" title="${esc(f.name)}"></iframe>`:`<div class="empty">لا توجد معاينة لهذا النوع. استخدم «فتح» أو «مشاركة».</div>`}</div>
  <div class="row-end"><button class="btn ghost" data-act="close">إغلاق</button><span class="sp"></span>${u?`<a class="btn" href="${u}" target="_blank" rel="noopener">فتح</a>`:""}<button class="btn" data-act="editLib" data-id="${id}">✎ إعادة تسمية / نقل</button><button class="btn primary" data-act="shareLib" data-id="${id}">${I.share} مشاركة</button></div>`,true)}

/* ========== lock zoom: no pinch, no double-tap, no input zoom ========== */
(function(){const meta=document.querySelector('meta[name=viewport]');const v="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover";if(meta)meta.setAttribute("content",v);else{const m=document.createElement("meta");m.name="viewport";m.content=v;document.head.appendChild(m)}
  const stop=e=>e.preventDefault();["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,stop,{passive:false}));
  document.addEventListener("touchmove",e=>{if(e.touches.length>1||(e.scale&&e.scale!==1))e.preventDefault()},{passive:false});
  let last=0;document.addEventListener("touchend",e=>{const n=Date.now();if(n-last<320&&!e.target.closest("input,textarea,select,button,a,label,[data-act],[data-go],[data-ob]"))e.preventDefault();last=n},{passive:false});
  document.addEventListener("wheel",e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
  document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&["+","-","=","0"].includes(e.key))e.preventDefault()})})();

/* ========== gestures: swipe between tabs, pull to refresh ========== */
let G=null;
function ptrShow(d,label,spin){const p=$("#ptr");if(!p)return;p.style.transform=`translate(-50%,${Math.min(d,90)-70}px)`;p.style.opacity=Math.min(1,d/60);p.classList.toggle("spin",!!spin);p.querySelector("svg").style.rotate=spin?"":(d*3)+"deg";p.querySelector("span").textContent=label}
function ptrHide(){const p=$("#ptr");if(!p)return;p.style.transition="transform .25s,opacity .25s";ptrShow(0,"",false);setTimeout(()=>{if(p)p.style.transition=""},260)}
async function doRefresh(){ptrShow(80,S.sync.connected?"جارٍ المزامنة…":"جارٍ التحديث…",true);
  if(S.sync.connected){await syncNow(false)}else{S.anim="fade";render();toast("تم تحديث البيانات. Google Drive غير متصل، اربطه من الإعدادات ليتزامن مع أجهزتك.",4200)}
  ptrShow(80,"تم",false);setTimeout(ptrHide,350)}
document.addEventListener("touchstart",e=>{if($("#scrim")||$(".ob")||e.touches.length>1){G=null;return}const t=e.touches[0];const w=window.innerWidth;
  G={x:t.clientX,y:t.clientY,t:Date.now(),top:window.scrollY<=2,el:(e.target&&e.target.nodeType===1?e.target:(e.target&&e.target.parentElement)||document.body),edge:t.clientX<22||t.clientX>w-22,pull:0}},{passive:true});
document.addEventListener("touchmove",e=>{if(!G)return;const t=e.touches[0];const dx=t.clientX-G.x,dy=t.clientY-G.y;
  if(G.top&&dy>8&&Math.abs(dy)>Math.abs(dx)*1.4&&!G.el.closest("textarea,.chart-wrap")){G.pull=dy*.5;ptrShow(G.pull,G.pull>=70?"أفلت للتحديث":"اسحب للتحديث",false)}},{passive:true});
document.addEventListener("touchend",e=>{if(!G)return;const g=G;G=null;const t=e.changedTouches[0];const dx=t.clientX-g.x,dy=t.clientY-g.y,dt=Date.now()-g.t;
  if(g.pull){if(g.pull>=70)doRefresh();else ptrHide();return}
  if(g.edge||dt>700||Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.8)return;
  if(g.el.closest("input,textarea,select,.chips,.chart-wrap,.thumbs,.folders,.nav,.top,.crumbs"))return;
  const i=ORDER.indexOf(baseTab(S.view));const n=dx>0?i+1:i-1;if(n>=0&&n<ORDER.length)go(ORDER[n])},{passive:true});

 case"gToggle":{const g={...(S.db.settings.guide||{})};g[ds.id]=!g[ds.id];S.db.settings={...S.db.settings,guide:g,u:now()};save();render();if(g[ds.id]){const n=Object.values(g).filter(Boolean).length;toast(n>=GUIDE.length?"أحسنت! أنهيت كل خطوات التأسيس.":`ممتاز، أنجزت ${n} من ${GUIDE.length}. افتح الخطوة التالية.`,3200)}break}

 case"shareReport":{const per=S.f.per||"month";const bk=buckets(per);const cur=bk[bk.length-1];const rows=txF().filter(t=>t.date>=bk[0].a&&t.date<=cur.b).sort((a,b)=>a.date.localeCompare(b.date));
