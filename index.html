<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="إدارة أعمالي">
<meta name="theme-color" content="#1e4b41">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<title>إدارة أعمالي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: registry ledger — header with company switch, single scrolling column, bottom tab bar on phone / side rail on wide screens */
:root{
  --bg:#f2f4f1;--surface:#ffffff;--surface-2:#e8ede9;--ink:#16231f;--muted:#5b6a63;--line:#d4dcd7;
  --brand:#1e4b41;--brand-ink:#ffffff;--accent:#a8741a;
  --ok:#2e7a4d;--warn:#a96d12;--bad:#b3372e;--info:#2b678c;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1613;--surface:#15201c;--surface-2:#1c2924;--ink:#e4ebe7;--muted:#97a69f;--line:#293732;
  --brand:#5cae99;--brand-ink:#08120f;--accent:#d8a243;--ok:#5bc189;--warn:#e2aa4a;--bad:#ee7b70;--info:#6eb0d6;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1613;--surface:#15201c;--surface-2:#1c2924;--ink:#e4ebe7;--muted:#97a69f;--line:#293732;
  --brand:#5cae99;--brand-ink:#08120f;--accent:#d8a243;--ok:#5bc189;--warn:#e2aa4a;--bad:#ee7b70;--info:#6eb0d6;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.3}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.sp{flex:1}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;white-space:nowrap}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;opacity:.75;margin-top:-2px}
.co-sel{min-width:0;flex:1;max-width:260px;background:color-mix(in srgb,var(--brand-ink) 14%,transparent);border:1px solid color-mix(in srgb,var(--brand-ink) 25%,transparent);color:var(--brand-ink);border-radius:10px;padding:7px 10px;font-size:13px}
.co-sel option{color:#16231f;background:#fff}
.sync{display:flex;align-items:center;gap:6px;background:transparent;border:1px solid color-mix(in srgb,var(--brand-ink) 30%,transparent);color:var(--brand-ink);border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:color-mix(in srgb,var(--brand-ink) 45%,transparent)}
.dot.on{background:#7fe0a8}.dot.busy{background:#f1c76a;animation:pulse 1s infinite}.dot.err{background:#ff8f86}
@keyframes pulse{50%{opacity:.35}}
/* shell */
.shell{max-width:1100px;margin:0 auto;display:flex;gap:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px}
.rail{display:none}
main{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px}
.nav{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav button{background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
.nav button.on{color:var(--brand);font-weight:600}
.nav svg{width:22px;height:22px}
@media (min-width:900px){
  .nav{display:none}
  .rail{display:flex;flex-direction:column;gap:4px;width:200px;flex-shrink:0;position:sticky;top:80px;align-self:flex-start}
  .rail button{display:flex;align-items:center;gap:10px;background:none;border:0;padding:10px 12px;border-radius:10px;color:var(--muted);cursor:pointer;text-align:right;font-size:14px}
  .rail button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset -3px 0 0 var(--brand)}
  .rail svg{width:20px;height:20px}
  .shell{padding-block:24px 40px}
}
/* blocks */
.page-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-h h1{font-size:24px}
.page-h p{margin:2px 0 0;color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h2{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:right;cursor:default}
button.stat{cursor:pointer}
.stat .lbl{font-size:12px;color:var(--muted);letter-spacing:.01em}
.stat .val{font-family:var(--f-display);font-size:22px;font-weight:600}
.stat.bad .val{color:var(--bad)}.stat.warn .val{color:var(--warn)}.stat.ok .val{color:var(--ok)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);background:none;border-inline:0;border-top:0;width:100%;text-align:right;cursor:pointer}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;background:var(--surface-2);color:var(--brand)}
.ico svg{width:20px;height:20px}
.pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.pill.info{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.amt-in{color:var(--ok);font-weight:600}.amt-out{color:var(--ink);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row-end{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;cursor:pointer}
.quick svg{width:22px;height:22px;color:var(--brand)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.empty{padding:22px 8px;text-align:center;color:var(--muted);font-size:14px}
.demo-note{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--accent) 12%,transparent);border:1px dashed color-mix(in srgb,var(--accent) 55%,transparent);border-radius:var(--r);padding:10px 14px;font-size:13.5px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.chart-wrap{overflow-x:auto}
.chart-wrap svg{display:block;width:100%;min-width:300px;height:auto}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;vertical-align:-1px}
.insight{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.insight:last-child{border-bottom:0}
.insight .mk{width:4px;border-radius:4px;flex-shrink:0;background:var(--info)}
.insight.bad .mk{background:var(--bad)}.insight.warn .mk{background:var(--warn)}.insight.ok .mk{background:var(--ok)}
.insight .t{font-weight:600}.insight .s{font-size:13px;color:var(--muted)}
.score{display:flex;align-items:center;gap:14px}
.score .big{font-family:var(--f-display);font-size:34px;font-weight:700}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.thumb{aspect-ratio:3/4;max-width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden;cursor:pointer;padding:0;font-size:11px;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:28px;height:28px;color:var(--bad)}
/* modal */
.scrim{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet.wide{max-width:900px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet h2{font-size:19px}
.form{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:13px;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.fld textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.viewer img{width:100%;border-radius:10px}
.viewer iframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:10px;background:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:pan-x pan-y}
body{overscroll-behavior-y:contain;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y}
button,a,label,.item,.chip,.folder,.fcard{touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,select,textarea,.search{font-size:16px!important}
main.anim-next{animation:slideN .24s cubic-bezier(.2,.8,.2,1)}main.anim-prev{animation:slideP .24s cubic-bezier(.2,.8,.2,1)}main.anim-fade{animation:fadeIn .2s ease-out}
@keyframes slideN{from{opacity:.35;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes slideP{from{opacity:.35;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:.4}to{opacity:1}}
.sheet{animation:sheetUp .22s cubic-bezier(.2,.8,.2,1)}@keyframes sheetUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.hbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:transparent;border:1px solid color-mix(in srgb,var(--brand-ink) 30%,transparent);color:var(--brand-ink);cursor:pointer;padding:0}
.hbtn svg{width:19px;height:19px}
@media (max-width:480px){.brand small{display:none}.brand{font-size:16px}.sync .st{max-width:84px;overflow:hidden;text-overflow:ellipsis}}
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:19;transform:translate(-50%,-70px);display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--brand);font-size:13px;font-weight:600;box-shadow:0 6px 18px color-mix(in srgb,#000 14%,transparent);opacity:0;pointer-events:none}
.ptr svg{width:18px;height:18px}.ptr.spin svg{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.tip{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--info) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--info) 28%,transparent);border-radius:var(--r);padding:11px 12px;font-size:13.5px}
.tip>svg{width:20px;height:20px;color:var(--info);flex-shrink:0;margin-top:2px}
.tip .x{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:2px 4px}
.drive{display:flex;align-items:center;gap:12px}
.drive .ico{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.drive.on .ico{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.folder{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:right;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.folder svg{width:30px;height:30px;color:var(--accent)}
.folder .t{font-weight:600;overflow-wrap:anywhere;font-size:14px}.folder .s{font-size:12px;color:var(--muted)}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.crumbs button{background:none;border:0;color:var(--brand);cursor:pointer;padding:2px 0;font-weight:600}
.crumbs span{color:var(--muted)}
.fname-row{display:flex;gap:8px;align-items:center}.fname-row input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
.ob{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.ob-card{max-width:420px;display:flex;flex-direction:column;align-items:center;gap:16px;animation:fadeIn .25s ease-out}
.ob-ill{width:104px;height:104px;border-radius:30px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.ob-ill svg{width:52px;height:52px}
.ob h2{font-size:24px}.ob p{margin:0;color:var(--muted);font-size:16px;line-height:1.8}
.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:99px;background:var(--line)}.dots i.on{width:22px;background:var(--brand)}
.ob .skip{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px}
.gstep{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gstep>summary{list-style:none;display:flex;gap:12px;align-items:center;padding:13px 14px;cursor:pointer}
.gstep>summary::-webkit-details-marker{display:none}
.gnum{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;flex-shrink:0;font-size:14px}
.gstep.done .gnum{background:var(--ok);border-color:var(--ok);color:#fff}
.gstep.done .gt{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent);color:var(--muted)}
.gt{font-weight:600}.gsub{font-size:12.5px;color:var(--muted)}
.gbody{padding:0 14px 14px 14px;display:flex;flex-direction:column;gap:10px;font-size:14px;border-top:1px solid var(--line);padding-top:12px}
.gbody h4{margin:0;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.01em}
.gbody ul{margin:0;padding-inline-start:20px}.gbody li{margin:2px 0}
.gbody a{color:var(--info);overflow-wrap:anywhere}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;text-align:right;cursor:pointer}
.fcard .ico{width:42px;height:42px}
.fcard .t{font-weight:600;font-family:var(--f-display)}.fcard .s{font-size:13px;color:var(--muted)}
.steps{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.disclaimer{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.demo-note>svg{width:20px;height:20px;flex-shrink:0;color:var(--accent)}
.item,.ov-row{flex-wrap:wrap}.item .main,.ov-row .main{flex:1 1 150px;min-width:140px}.ov-row .mini{flex:1 1 100%;justify-content:flex-start;padding-inline-start:50px}
.tip b{margin-left:4px}
@media (max-width:560px){.top-in{flex-wrap:wrap;row-gap:8px}.co-sel{order:9;flex:1 1 100%;max-width:none}}
.focus{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--brand) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--brand) 35%,transparent);border-radius:var(--r);padding:10px 12px;font-size:13.5px}
.focus>svg{width:20px;height:20px;color:var(--brand);flex-shrink:0}
.ov-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);background:none;border-inline:0;border-top:0;width:100%;text-align:right;cursor:pointer}
.ov-row:last-child{border-bottom:0}.ov-row .main{flex:1;min-width:0}.ov-row .t{font-weight:600;overflow-wrap:anywhere}.ov-row .s{font-size:12.5px;color:var(--muted)}
.mini{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 58px 84px auto;gap:6px;margin-bottom:6px;align-items:center}
.irow input,.prg input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px;width:100%;min-width:0}
.docprev{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}

/* ========== storage (IndexedDB with memory fallback) ========== */
const MEM={kv:{},files:{}};let IDB=null;
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open("idarat-a3mali",1);r.onupgradeneeded=()=>{r.result.createObjectStore("kv");r.result.createObjectStore("files")};r.onsuccess=()=>{IDB=r.result;res()};r.onerror=()=>res()}catch(e){res()}})}
function tx_(store,mode,fn){return new Promise((res,rej)=>{try{const t=IDB.transaction(store,mode),s=t.objectStore(store),r=fn(s);t.oncomplete=()=>res(r?r.result:undefined);t.onerror=()=>rej(t.error)}catch(e){rej(e)}})}
async function kvGet(k){if(!IDB)return MEM.kv[k];try{return await tx_("kv","readonly",s=>s.get(k))}catch(e){return MEM.kv[k]}}
async function kvSet(k,v){MEM.kv[k]=v;if(IDB)try{await tx_("kv","readwrite",s=>s.put(v,k))}catch(e){}}
async function fileGet(id){if(MEM.files[id])return MEM.files[id];if(!IDB)return null;try{return await tx_("files","readonly",s=>s.get(id))}catch(e){return null}}
async function filePut(id,b){MEM.files[id]=b;if(IDB)try{await tx_("files","readwrite",s=>s.put(b,id))}catch(e){}}
async function fileDel(id){delete MEM.files[id];if(IDB)try{await tx_("files","readwrite",s=>s.delete(id))}catch(e){}}
async function fileKeys(){if(!IDB)return Object.keys(MEM.files);try{return await tx_("files","readonly",s=>s.getAllKeys())}catch(e){return Object.keys(MEM.files)}}

function docStatus(d){const n=daysTo(d.expiry);if(n===null)return{k:"",cls:"",txt:"بلا تاريخ انتهاء",n:9e9};
  if(n<0)return{k:"expired",cls:"bad",txt:`منتهي منذ ${-n} يوم`,n};

  if(n<=30)return{k:"soon",cls:"warn",txt:`باقٍ ${n} يوم`,n};
  if(n<=(S.db.settings.alertDays||60))return{k:"upcoming",cls:"info",txt:`باقٍ ${n} يوم`,n};

/* bills status for current month */
function billStatus(b){const cur=ym(new Date());if(b.lastPaid===cur)return{k:"paid",cls:"ok",txt:"مدفوعة هذا الشهر"};
  const day=new Date().getDate();const due=Math.min(+b.dueDay||1,28);
  if(day>due)return{k:"overdue",cls:"bad",txt:`متأخرة منذ ${day-due} يوم`};
  if(due-day<=5)return{k:"due",cls:"warn",txt:due===day?"تستحق اليوم":`تستحق بعد ${due-day} يوم`};
  return{k:"later",cls:"",txt:`تستحق يوم ${due}`}}

/* ========== image compression ========== */
function compressImage(file){return new Promise(res=>{if(!file.type.startsWith("image/")||file.size<350000)return res(file);
  const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const mx=1800;let{width:w,height:h}=img;const r=Math.min(1,mx/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
    c.toBlob(b=>res(b&&b.size<file.size?new File([b],file.name.replace(/\.\w+$/,"")+".jpg",{type:"image/jpeg"}):file),"image/jpeg",.82)};
  img.onerror=()=>{URL.revokeObjectURL(url);res(file)};img.src=url})}
async function storeFiles(list){const out=[];for(const f of list){const b=await compressImage(f);const id="f"+uid();await filePut(id,b);out.push({id,name:f.name,mime:b.type||f.type,size:b.size})}return out}

function toast(m,ms){document.querySelectorAll(".toast").forEach(x=>x.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;t.setAttribute("role","status");document.body.appendChild(t);setTimeout(()=>t.remove(),ms||2800)}

S.blobs={};
function fileName(f,b){let n=(f&&f.name)||"ملف";if(!/\.[a-z0-9]{2,4}$/i.test(n))n+=b.type==="application/pdf"?".pdf":".jpg";return n}
async function docFiles(docs){const out=[];for(const d of docs)for(const f of d.files||[]){const b=S.blobs[f.id]||await getBlob(f.id);if(b){S.blobs[f.id]=b;const pre=docs.length>1?(ownerLabel(d)+" - "+d.type+" - "):"";out.push(new File([b],(pre+fileName(f,b)).replace(/[\\/:*?"<>|]/g,"-"),{type:b.type||"application/octet-stream"}))}}return out}
function docText(d){return[d.type,"خاص بـ: "+ownerLabel(d),d.number?"الرقم: "+d.number:"",d.issue?"تاريخ الإصدار: "+d.issue:"",d.expiry?"تاريخ الانتهاء: "+d.expiry:"",d.notes?"ملاحظات: "+d.notes:""].filter(Boolean).join("\n")}
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
async function share({files=[],title="",text=""}){
  try{if(files.length&&navigator.canShare&&navigator.canShare({files})){await navigator.share({files,title,text});return true}
      if(!files.length&&navigator.share){await navigator.share({title,text});return true}}
  catch(e){if(e&&e.name==="AbortError")return true;if(e&&e.name==="NotAllowedError"&&files.length){toast("اضغط «مشاركة» مرة أخرى");return false}}
  if(files.length){files.forEach(f=>dl(f,f.name));toast("المشاركة غير مدعومة في هذا المتصفح، تم تنزيل الملفات")}else copyText(text);return false}

function fieldHTML(f){const id="f_"+f.k,v=f.val??"";const req=f.req?" required":"";
  const lab=`<label for="${id}">${esc(f.label)}${f.req?" *":""}</label>`;
  if(f.type==="select")return`<div class="fld">${lab}<select id="${id}"${req}>${f.options.map(o=>{const[val,l]=Array.isArray(o)?o:[o,o];return`<option value="${esc(val)}"${String(val)===String(v)?" selected":""}>${esc(l)}</option>`}).join("")}</select></div>`;
  if(f.type==="textarea")return`<div class="fld">${lab}<textarea id="${id}">${esc(v)}</textarea></div>`;
  if(f.type==="html")return f.html||"";
  if(f.type==="files")return`<div class="fld"><label>${esc(f.label||"المرفقات (PDF أو صور)")}</label><div class="row"><label class="btn sm" for="f_pick">${I.clip} اختيار ملف</label><input id="f_pick" type="file" accept="image/*,application/pdf" multiple hidden><label class="btn sm" for="f_cam">${I.cam} تصوير</label><input id="f_cam" type="file" accept="image/*" capture="environment" hidden></div><div id="f_names" class="muted" style="font-size:13px"></div></div>`;
  if(f.type==="row")return`<div class="two">${f.items.map(fieldHTML).join("")}</div>`;
  return`<div class="fld">${lab}<input id="${id}" type="${f.type||"text"}" value="${esc(v)}"${f.type==="number"?' step="any" inputmode="decimal"':""}${f.im?` inputmode="${f.im}"`:""}${f.type==="password"?' autocomplete="new-password"':""}${req}${f.ph?` placeholder="${esc(f.ph)}"`:""}${f.list?` list="dl_${f.k}" autocomplete="off"`:""}>${f.list?`<datalist id="dl_${f.k}">${f.list.map(x=>`<option value="${esc(x)}"></option>`).join("")}</datalist>`:""}</div>`}
function openForm(o){S.pending=[];modal(`<h2>${esc(o.title)}</h2><form id="frm" class="form" novalidate>${o.fields.map(fieldHTML).join("")}<div class="row-end">${o.onDelete?'<button type="button" class="btn danger" data-act="formDel">حذف</button>':""}<span class="sp"></span><button type="button" class="btn ghost" data-act="close">إلغاء</button><button class="btn primary" type="submit">حفظ</button></div></form>`);S.form=o;

/* reports */
function buckets(per){const out=[];const d=new Date();d.setHours(0,0,0,0);
  if(per==="day"){for(let i=13;i>=0;i--){const x=new Date(d);x.setDate(d.getDate()-i);const s=ymd(x);out.push({l:String(x.getDate()),a:s,b:s})}}
  else if(per==="week"){const st=new Date(d);st.setDate(d.getDate()-d.getDay());for(let i=7;i>=0;i--){const a=new Date(st);a.setDate(st.getDate()-7*i);const b=new Date(a);b.setDate(a.getDate()+6);out.push({l:a.getDate()+"/"+(a.getMonth()+1),a:ymd(a),b:ymd(b)})}}
  else if(per==="month"){for(let i=11;i>=0;i--){const a=new Date(d.getFullYear(),d.getMonth()-i,1),b=new Date(d.getFullYear(),d.getMonth()-i+1,0);out.push({l:MONTHS[a.getMonth()],a:ymd(a),b:ymd(b)})}}
  else{for(let i=4;i>=0;i--){const y=d.getFullYear()-i;out.push({l:String(y),a:y+"-01-01",b:y+"-12-31"})}}
  return out.map(x=>({...x,...sumRange(x.a,x.b)}))}
function niceMax(v){if(v<=0)return 100;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return(n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function barChart(bk){const W=640,H=240,L=56,R=10,T=12,B=28;const mx=niceMax(Math.max(...bk.map(b=>Math.max(b.i,b.o)),1));const iw=W-L-R,ih=H-T-B;const bw=iw/bk.length;const g=Math.max(2,bw*.14);const w=(bw-g*3)/2;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="الدخل والمصروفات" style="direction:ltr">`;
  for(let k=0;k<=4;k++){const v=mx*k/4,y=T+ih-ih*k/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v>=1000?(v/1000).toLocaleString("en-US",{maximumFractionDigits:1})+"k":Math.round(v)}</text>`}
  bk.forEach((b,i)=>{const x=L+i*bw+g;const hi=ih*b.i/mx,ho=ih*b.o/mx;
    s+=`<rect x="${x}" y="${T+ih-hi}" width="${w}" height="${Math.max(hi,0)}" rx="2" fill="var(--brand)"><title>دخل ${money(b.i)}</title></rect><rect x="${x+w+g}" y="${T+ih-ho}" width="${w}" height="${Math.max(ho,0)}" rx="2" fill="var(--accent)"><title>مصروف ${money(b.o)}</title></rect><text x="${L+i*bw+bw/2}" y="${H-9}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(b.l)}</text>`});
  return s+`</svg>`}
VIEWS.reports=()=>{const per=S.f.per||"month";const bk=buckets(per);const cur=bk[bk.length-1],prev=bk[bk.length-2]||{i:0,o:0,n:0};
  const names={day:["يومي","اليوم","أمس"],week:["أسبوعي","هذا الأسبوع","الأسبوع الماضي"],month:["شهري","هذا الشهر","الشهر الماضي"],year:["سنوي","هذه السنة","السنة الماضية"]};
  const cats={};txF().forEach(t=>{if(t.kind==="out"&&t.date>=cur.a&&t.date<=cur.b)cats[t.category]=(cats[t.category]||0)+ +t.amount});const ce=Object.entries(cats).sort((a,b)=>b[1]-a[1]);const ct=ce.reduce((s,x)=>s+x[1],0);
  const byCo=coList().map(c=>{let i=0,o=0;S.db.tx.forEach(t=>{if(t.companyId===c.id&&t.date>=cur.a&&t.date<=cur.b){t.kind==="in"?i+=+t.amount:t.kind==="out"?o+=+t.amount:0}});return{c,i,o}});
  const ch=v=>`<button class="chip${per===v?" on":""}" data-act="per" data-v="${v}">${names[v][0]}</button>`;
  const delta=(a,b)=>b?` <span class="muted" style="font-size:12px">(${a>=b?"+":""}${Math.round((a-b)/b*100)}% عن ${names[per][2]})</span>`:"";
  return`${demoBar()}<div class="page-h"><div><h1>التقارير</h1><p>تتبع الأداء يوميًا وأسبوعيًا وشهريًا وسنويًا.</p></div><span class="sp"></span><button class="btn sm" data-act="copyReport">نسخ</button><button class="btn sm primary" data-act="shareReport">${I.share} مشاركة التقرير</button></div>
  <div class="chips">${ch("day")}${ch("week")}${ch("month")}${ch("year")}</div>

function finInsights(){const out=[];const[a,b]=monthRange(0),[pa,pb]=monthRange(-1);const c=sumRange(a,b),p=sumRange(pa,pb);
  const day=new Date().getDate(),dim=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate();
  if(c.i||c.o){if(c.o>c.i)out.push(["bad","المصروفات تتجاوز الدخل هذا الشهر",`العجز حاليًا ${money(c.o-c.i)} ر.ع. راجع البنود الأكبر أو أجّل المشتريات غير الضرورية حتى يتحسن الدخل.`]);
    else out.push(["ok",`هامش الربح هذا الشهر ${c.i?Math.round(c.n/c.i*100):0}%`,`الصافي ${money(c.n)} ر.ع حتى اليوم ${day} من ${dim}. هامش فوق 20% يعتبر صحيًا لمعظم الأنشطة التجارية الصغيرة.`])}
  if(p.o&&c.o){const proj=c.o/day*dim;const ch=(proj-p.o)/p.o*100;if(ch>15)out.push(["warn",`المصروفات تسير نحو زيادة ${Math.round(ch)}%`,`بالوتيرة الحالية سيصل مصروف الشهر إلى نحو ${money(proj)} ر.ع مقابل ${money(p.o)} الشهر الماضي.`])}
  const cats={};txF().forEach(t=>{if(t.kind==="out"&&t.date>=pa&&t.date<=b)cats[t.category]=(cats[t.category]||0)+ +t.amount});const tot=Object.values(cats).reduce((s,x)=>s+x,0);const top=Object.entries(cats).sort((x,y)=>y[1]-x[1])[0];
  if(top&&tot&&top[1]/tot>.4)out.push(["warn",`«${top[0]}» تستهلك ${Math.round(top[1]/tot*100)}% من المصروفات`,`تركّز المصروف في بند واحد يرفع المخاطرة. ابحث عن بدائل أو تفاوض على السعر في هذا البند أولًا.`]);
  const od=S.db.bills.filter(coOk).filter(x=>billStatus(x).k==="overdue");if(od.length)out.push(["bad",`${od.length} فاتورة ثابتة متأخرة`,od.map(x=>x.name+" ("+money(x.amount)+")").join("، ")+". التأخير في الكهرباء والماء قد يسبب قطع الخدمة أو غرامات."]);
  const fixed=S.db.bills.filter(coOk).reduce((s,x)=>s+ +x.amount,0);const sal=S.db.employees.filter(coOk).reduce((s,e)=>s+(+e.salary||0),0);
  let inc3=0;for(let k=1;k<=3;k++){const[x,y]=monthRange(-k);inc3+=sumRange(x,y).i}inc3/=3;
  if(fixed+sal)out.push(["info",`الالتزامات الشهرية الثابتة ${money(fixed+sal)} ر.ع`,`تشمل الرواتب ${money(sal)} والفواتير ${money(fixed)}${inc3?`، وتمثل ${Math.round((fixed+sal)/inc3*100)}% من متوسط الدخل لآخر 3 أشهر`:""}. يُنصح باحتياطي نقدي يغطي 3 أشهر منها: ${money((fixed+sal)*3)} ر.ع.`]);
  S.db.projects.filter(coOk).forEach(pr=>{const sp=projSpent(pr);if(pr.budget&&sp/pr.budget>=.85&&pr.status!=="مكتمل")out.push([sp>pr.budget?"bad":"warn",`مشروع «${pr.name}» استهلك ${Math.round(sp/pr.budget*100)}% من ميزانيته`,`نسبة الإنجاز ${pr.progress||0}% فقط. راجع التكاليف المتبقية قبل تجاوز الميزانية.`])});
  out.push(...extraFin());
  if(!out.length)out.push(["info","لا توجد بيانات كافية بعد","سجّل الدخل والمصروفات لبضعة أسابيع ليبدأ المستشار بإعطاء توصيات دقيقة."]);return out}
function fileInsights(){const out=[];const docs=docsF();const st=docs.map(d=>({d,s:docStatus(d)}));
  const ex=st.filter(x=>x.s.k==="expired");if(ex.length)out.push(["bad",`${ex.length} مستند منتهي يحتاج تجديدًا فورًا`,ex.slice(0,5).map(x=>`${x.d.type} — ${ownerLabel(x.d)}`).join("، ")+". العمل بسجل أو تصريح منتهٍ قد يعرّض الشركة لمخالفات."]);
  const so=st.filter(x=>x.s.k==="soon");if(so.length)out.push(["warn",`${so.length} مستند ينتهي خلال 30 يومًا`,so.slice(0,5).map(x=>`${x.d.type} — ${ownerLabel(x.d)} (${x.s.n} يوم)`).join("، ")+". ابدأ إجراءات التجديد الآن لتجنب التأخير."]);
  S.db.employees.filter(coOk).forEach(e=>{const miss=REQUIRED_EMP.filter(t=>!S.db.docs.some(d=>d.ownerId===e.id&&d.type===t));if(miss.length)out.push(["warn",`ملف ${e.name} ناقص`,`لا يوجد: ${miss.join("، ")}.`])});
  coList().forEach(c=>{const has=t=>S.db.docs.some(d=>d.companyId===c.id&&d.ownerType==="company"&&d.type===t);const miss=["سجل تجاري","شهادة التسجيل الضريبي"].filter(t=>!has(t));if(miss.length)out.push(["warn",`${c.name}: مستندات أساسية غير مسجلة`,miss.join("، ")+"."])});
  const noAtt=docs.filter(d=>!(d.files||[]).length).length;if(noAtt)out.push(["info",`${noAtt} مستند بدون نسخة مرفقة`,"أرفق صورة أو PDF لكل مستند لتستخرجه بسرعة عند الحاجة من أي جهاز."]);
  if(!out.length)out.push(["ok","الملفات مكتملة ومحدّثة","كل المستندات سارية ولها مرفقات."]);return out}
function healthScore(){const docs=docsF();if(!docs.length)return 100;const ok=docs.filter(d=>{const k=docStatus(d).k;return k==="ok"||k===""||k==="upcoming"}).length;const att=docs.filter(d=>(d.files||[]).length).length;return Math.round((ok/docs.length)*80+(att/docs.length)*20)}

/* ========== merge (per record, newest wins, deletions tracked) ========== */
function mergeDB(a,b){const r=emptyDB();r.del={...(a.del||{})};for(const[k,v]of Object.entries(b.del||{}))r.del[k]=Math.max(r.del[k]||0,v);
  for(const c of COLL){const m=new Map();for(const x of a[c]||[])m.set(x.id,x);for(const x of b[c]||[]){const y=m.get(x.id);if(!y||(x.u||0)>(y.u||0))m.set(x.id,x)}
    r[c]=[...m.values()].filter(x=>!(r.del[x.id]>=(x.u||0)))}
  r.settings=((b.settings||{}).u||0)>((a.settings||{}).u||0)?b.settings:a.settings;if(a.demo&&b.demo)r.demo=true;return r}

const SCOPE="https://www.googleapis.com/auth/drive.appdata";const MAIN="idarat-a3mali-db.enc";

function setSync(s){S.syncState=s;const b=document.querySelector(".sync .dot");if(b){b.className="dot "+(s==="on"?"on":s==="busy"?"busy":s==="err"?"err":"");b.parentNode.querySelector(".st").textContent=SYNC_TXT[s]}}

async function deriveKey(pass,salt){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:150000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function enc(buf){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const k=await deriveKey(S.sync.pass,salt);const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,buf));const out=new Uint8Array(28+ct.length);out.set(salt);out.set(iv,16);out.set(ct,28);return out}
async function dec(buf){const a=new Uint8Array(buf);const k=await deriveKey(S.sync.pass,a.slice(0,16));return crypto.subtle.decrypt({name:"AES-GCM",iv:a.slice(16,28)},k,a.slice(28))}
function loadGIS(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=()=>res();s.onerror=()=>rej(new Error("gis"));document.head.appendChild(s)})}
async function getToken(interactive){if(S.token&&S.tokenExp>now()+60000)return S.token;await loadGIS();return new Promise((res,rej)=>{const c=google.accounts.oauth2.initTokenClient({client_id:S.sync.clientId,scope:SCOPE,callback:r=>{if(r.error)return rej(new Error(r.error));S.token=r.access_token;S.tokenExp=now()+(r.expires_in||3600)*1000;res(S.token)},error_callback:e=>rej(new Error(e.type||"popup"))});c.requestAccessToken({prompt:interactive&&!S.sync.connected?"consent":""})})}
async function gfetch(url,opt={}){const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:"Bearer "+S.token}});if(!r.ok)throw new Error("drive "+r.status);return r}
async function findFile(name){const q=encodeURIComponent(`name='${name}'`);const r=await gfetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,name)&pageSize=10`);return((await r.json()).files||[])[0]}
async function uploadFile(name,bytes,id){if(id){await gfetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{method:"PATCH",headers:{"Content-Type":"application/octet-stream"},body:bytes});return id}
  const fd=new FormData();fd.append("metadata",new Blob([JSON.stringify({name,parents:["appDataFolder"]})],{type:"application/json"}));fd.append("file",new Blob([bytes],{type:"application/octet-stream"}));
  const r=await gfetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",body:fd});return(await r.json()).id}
async function download(id){const r=await gfetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);return r.arrayBuffer()}
async function drivePullFile(fid){const f=await findFile("f_"+fid+".enc");if(!f)return null;const plain=new Uint8Array(await dec(await download(f.id)));const tl=plain[0];const type=new TextDecoder().decode(plain.slice(1,1+tl));return new Blob([plain.slice(1+tl)],{type})}
async function syncNow(silent){if(!S.sync.clientId||!S.sync.pass){if(!silent){S.view="prefs";render();toast("أدخل معرّف العميل وكلمة التشفير أولًا")}return}
  if(S.syncState==="busy")return;setSync("busy");

    const f=await findFile(MAIN);let remote=null;

VIEWS.guide=()=>{const g=S.db.settings.guide||{};const sec=S.db.settings.sector||"trade";const n=GUIDE.filter(x=>g[x.id]).length;
  return`<div class="page-h"><div><h1>دليل تأسيس المشروع</h1><p>الخطوات بالترتيب لتأسيس نشاط تجاري في سلطنة عمان، والمستندات المطلوبة في كل خطوة ومن أين تُستخرج.</p></div></div>

  <div style="display:flex;flex-direction:column;gap:10px">${GUIDE.map((x,i)=>{const done=!!g[x.id];const open=!done&&GUIDE.findIndex(y=>!g[y.id])===i;
   const docs=x.sector?SECTORS[sec].items:x.docs;
   return`<details class="gstep${done?" done":""}"${open?" open":""}><summary><span class="gnum">${done?I.check.replace("<svg",'<svg width="16" height="16"'):i+1}</span><span class="sp" style="min-width:0"><span class="gt">${esc(x.t)}</span><div class="gsub">${esc(x.sub)} · المدة التقريبية: ${esc(x.time)}</div></span></summary>
    <div class="gbody"><div>${esc(x.why)}</div>
    ${docs.length?`<div><h4>${x.sector?"المطلوب لنشاط «"+esc(SECTORS[sec].l)+"»":"المستندات المطلوبة"}</h4><ul>${docs.map(d=>`<li>${esc(d)}</li>`).join("")}</ul></div>`:""}
    ${x.where.length?`<div><h4>من أين؟</h4><ul>${x.where.map(w=>`<li>${w.u?`<a href="${w.u}" target="_blank" rel="noopener">${esc(w.t)}</a>`:esc(w.t)}</li>`).join("")}</ul></div>`:""}
    ${x.tips.length?`<div><h4>نصائح</h4><ul>${x.tips.map(t=>`<li>${t}</li>`).join("")}</ul></div>`:""}
    <div class="row">${(x.add||[]).map(([t,o])=>`<button class="btn sm" data-act="gDoc" data-type="${esc(t)}" data-owner="${o}">${I.plus} أضف «${esc(t)}» لمستنداتي</button>`).join("")}<span class="sp"></span><button class="btn sm ${done?"":"primary"}" data-act="gToggle" data-id="${x.id}">${done?"إلغاء الإنجاز":I.check+" تمّت"}</button></div></div></details>`}).join("")}</div>
  <section class="panel disclaimer">هذا الدليل للتوجيه العام وليس استشارة قانونية. الإجراءات والرسوم وأسماء المنصات قد تتغير، فتأكد من الجهة المختصة أو من أقرب مكتب «سند» قبل التقديم.

const coOkLoose=r=>{const c=S.local.co||"all";if(c==="all")return true;const pid=focusP();if(pid)return r.projectId===pid;return!r.companyId||r.companyId===c};
const baseName=n=>String(n||"ملف").replace(/\.[a-z0-9]{2,5}$/i,"");
function libFileName(f,b){const ext=b.type==="application/pdf"?".pdf":b.type.startsWith("image/")?(b.type.includes("png")?".png":".jpg"):((f.meta.name||"").match(/\.[a-z0-9]{2,5}$/i)||[""])[0];return(f.name+ext).replace(/[\\/:*?"<>|]/g,"-")}
const folderName=id=>(S.db.folders.find(x=>x.id===id)||{}).name||"";
function folderPath(id){const out=[];let cur=S.db.folders.find(x=>x.id===id);let guard=0;while(cur&&guard++<20){out.unshift(cur);cur=S.db.folders.find(x=>x.id===cur.parentId)}return out}
function folderOpts(){const out=[["","ملفاتي (الرئيسي)"]];const walk=(pid,depth)=>{S.db.folders.filter(f=>(f.parentId||"")===pid).sort((a,b)=>a.name.localeCompare(b.name,"ar")).forEach(f=>{out.push([f.id,"— ".repeat(depth+1)+f.name]);if(depth<6)walk(f.id,depth+1)})};walk("",0);return out}
const kb=n=>n>1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";
const fIcon=m=>m==="application/pdf"?I.pdf:(m||"").startsWith("image/")?I.img:I.file;
VIEWS.files=()=>{const f=S.f.files||(S.f.files={folder:"",q:"",sort:"date"});const q=(f.q||"").toLowerCase();
  if(f.folder&&!S.db.folders.some(x=>x.id===f.folder))f.folder="";
  const folders=q?[]:S.db.folders.filter(coOkLoose).filter(x=>(x.parentId||"")===f.folder).sort((a,b)=>a.name.localeCompare(b.name,"ar"));
  let files=S.db.files.filter(coOkLoose);files=q?files.filter(x=>(x.name+" "+(x.note||"")).toLowerCase().includes(q)):files.filter(x=>(x.folderId||"")===f.folder);
  files.sort(f.sort==="name"?(a,b)=>a.name.localeCompare(b.name,"ar"):(a,b)=>(b.u||0)-(a.u||0));
  const path=folderPath(f.folder);const cnt=id=>S.db.files.filter(x=>x.folderId===id).length+S.db.folders.filter(x=>x.parentId===id).length;
  return`${demoBar()}<div class="page-h"><div><h1>ملفاتي</h1><p>مجلداتك وملفاتك بأسماء تختارها بنفسك.</p></div><span class="sp"></span><button class="btn" data-act="newFolder">${I.folder} مجلد جديد</button><button class="btn primary" data-act="newLib">${I.plus} إضافة ملف</button></div>
  <input class="search" id="libQ" type="search" placeholder="ابحث في كل الملفات بالاسم أو الملاحظة…" value="${esc(f.q||"")}">
  ${q?"":`<div class="crumbs"><button data-act="openFolder" data-id="">ملفاتي</button>${path.map(p=>`<span>‹</span><button data-act="openFolder" data-id="${p.id}">${esc(p.name)}</button>`).join("")}${f.folder?`<span class="sp"></span><button class="btn sm ghost" data-act="editFolder" data-id="${f.folder}">✎ المجلد</button>${files.length?`<button class="btn sm" data-act="shareFolder">${I.share} مشاركة المجلد</button>`:""}`:""}</div>`}
  ${folders.length?`<div class="folders">${folders.map(x=>`<button class="folder" data-act="openFolder" data-id="${x.id}">${I.folder}<span class="t">${esc(x.name)}</span><span class="s">${cnt(x.id)} عنصر${x.companyId?" · "+esc(coName(x.companyId)):""}</span></button>`).join("")}</div>`:""}
  <section class="panel"><div class="row" style="margin-bottom:4px"><b>${q?"نتائج البحث":"الملفات"}</b><span class="muted num" style="font-size:12px">${files.length}</span><span class="sp"></span><div class="chips"><button class="chip${f.sort!=="name"?" on":""}" data-act="libSort" data-v="date">الأحدث</button><button class="chip${f.sort==="name"?" on":""}" data-act="libSort" data-v="name">بالاسم</button></div></div>
  ${files.length?`<div class="list">${files.map(x=>`<button class="item" data-act="openLib" data-id="${x.id}"><span class="ico" style="color:var(${x.meta&&x.meta.mime==="application/pdf"?"--bad":"--brand"})">${fIcon(x.meta&&x.meta.mime)}</span><span class="main"><span class="t">${esc(x.name)}</span><div class="s">${kb(x.meta?x.meta.size:0)} · ${fdate(x.date)}${q&&x.folderId?" · "+esc(folderName(x.folderId)):""}${x.note?" · "+esc(x.note):""}</div></span></button>`).join("")}</div>`:`<div class="empty">${q?"لا توجد ملفات بهذا الاسم.":"لا توجد ملفات هنا بعد. اضغط «إضافة ملف» واختر ملفًا أو صوّر ورقة."}</div>`}</section>`};

function invTot(inv){const sub=r3((inv.items||[]).reduce((s,i)=>s+(+i.qty||0)*(+i.price||0),0));const disc=r3(Math.min(+inv.discount||0,sub));const b0=r3(sub-disc);const rr=+inv.vatRate||0;const vat=inv.vatInc?r3(b0*rr/(100+rr)):r3(b0*rr/100);const total=inv.vatInc?b0:r3(b0+vat);const base=r3(total-vat);const paid=r3((inv.payments||[]).reduce((s,p)=>s+ +p.amount,0));return{sub,disc,base,vat,total,paid,due:r3(total-paid)}}
function invStatus(inv){if(inv.cancelled)return{k:"cancel",cls:"",txt:"ملغاة"};const t=invTot(inv);
 if(inv.kind==="quote"){if(inv.convertedTo)return{k:"conv",cls:"ok",txt:"تحوّل لفاتورة"};if(inv.due&&daysTo(inv.due)<0)return{k:"exp",cls:"",txt:"انتهت صلاحيته"};return{k:"open",cls:"info",txt:"عرض سعر"}}
 if(t.due<=0.0005)return{k:"paid",cls:"ok",txt:"مدفوعة"};const n=daysTo(inv.due);if(inv.due&&n<0)return{k:"overdue",cls:"bad",txt:`متأخرة ${-n} يوم`};if(t.paid>0)return{k:"partial",cls:"warn",txt:"مدفوعة جزئيًا"};return{k:"unpaid",cls:"info",txt:inv.due?(n===0?"تستحق اليوم":`تستحق بعد ${n} يوم`):"غير مدفوعة"}}
function nextNo(kind,coId){const pre=kind==="quote"?"QT":"INV";const y=new Date().getFullYear();const re=new RegExp("^"+pre+"-"+y+"-(\\d+)$");let mx=0;S.db.invoices.forEach(i=>{if(i.companyId===coId){const m=String(i.number||"").match(re);if(m)mx=Math.max(mx,+m[1])}});return`${pre}-${y}-${String(mx+1).padStart(4,"0")}`}

function plPeriod(k){const d=new Date(),y=d.getFullYear(),m=d.getMonth();if(k==="month")return[ymd(new Date(y,m,1)),ymd(new Date(y,m+1,0)),"هذا الشهر"];if(k==="lastm")return[ymd(new Date(y,m-1,1)),ymd(new Date(y,m,0)),"الشهر الماضي"];if(k==="q"){const q=Math.floor(m/3);return[ymd(new Date(y,q*3,1)),ymd(new Date(y,q*3+3,0)),"هذا الربع"]}if(k==="year")return[`${y}-01-01`,`${y}-12-31`,"هذه السنة"];return[`${y-1}-01-01`,`${y-1}-12-31`,"السنة الماضية"]}

 let pay=0,er=0;if(!focusP())S.db.payruns.filter(p=>p.posted&&p.month>=a.slice(0,7)&&p.month<=b.slice(0,7)&&(!co||p.companyId===co)).forEach(p=>{const t=prTot(p);pay+=t.gross;er+=t.er});

function quarterRange(off){const d=new Date();let q=Math.floor(d.getMonth()/3)+off,y=d.getFullYear();while(q<0){q+=4;y--}while(q>3){q-=4;y++}return[ymd(new Date(y,q*3,1)),ymd(new Date(y,q*3+3,0)),`الربع ${["الأول","الثاني","الثالث","الرابع"][q]} ${y}`]}
function vatData(a,b){let outV=0,outB=0,inV=0,inB=0;const inS=x=>x>=a&&x<=b;
 S.db.invoices.filter(i=>i.kind!=="quote"&&!i.cancelled&&inS(i.date)&&coOk(i)).forEach(i=>{const t=invTot(i);outV+=t.vat;outB+=t.base});
 txF().forEach(t=>{if(!inS(t.date)||!(+t.vat))return;if(t.kind==="in"&&!t.invoiceId){outV+=+t.vat;outB+=+t.amount-+t.vat}if(t.kind==="out"&&!t.payableId){inV+=+t.vat;inB+=+t.amount-+t.vat}});
 S.db.payables.filter(p=>inS(p.date)&&coOk(p)).forEach(p=>{inV+=+p.vat||0;inB+=(+p.amount)-(+p.vat||0)});
 return{outV:r3(outV),outB:r3(outB),inV:r3(inV),inB:r3(inB),net:r3(outV-inV)}}

function cashForecast(){const co=scopeCo();const accs=S.db.accounts.filter(a=>!co||a.companyId===co);const td=today();
 let open=0;if(accs.length)open=accs.reduce((s,a)=>s+accBal(a,td),0);else txF().forEach(t=>{if(t.date<=td&&t.kind!=="tr")open+=t.kind==="in"?+t.amount:-t.amount});
 const billCats=new Set(S.db.bills.map(b=>b.category));let avgIn=0,avgOut=0;for(let k=1;k<=3;k++){const[x,y]=monthRange(-k);txF().forEach(t=>{if(t.date<x||t.date>y||t.kind==="tr"||t.invoiceId||t.payableId||t.payrunId||t.spfPay||t.advId)return;if(t.kind==="in"&&t.category!=="استثمار / تمويل")avgIn+=+t.amount;else if(t.kind==="out"&&!billCats.has(t.category)&&t.category!=="رواتب"&&t.category!=="سلف للموظفين")avgOut+=+t.amount})}avgIn/=3;avgOut/=3;
 const rt=spfRates();const payroll=S.db.employees.filter(e=>!co||e.companyId===co).reduce((s,e)=>{const g=empGross(e);return s+g+Math.min(g,3000)*(isOm(e)?rt.omEr:rt.exEr)/100},0);
 const months=[];let bal=open;
 for(let k=0;k<3;k++){const[a,b]=monthRange(k);const frac=k===0?(daysTo(b)+1)/(+b.slice(8)):1;let inv=0,pay=0,bills=0;const inM=d=>(k===0&&d<=b)||(d>=a&&d<=b);
  S.db.invoices.filter(i=>i.kind!=="quote"&&!i.cancelled&&coOk(i)).forEach(i=>{const t=invTot(i);if(t.due>0.0005&&inM(i.due||i.date))inv+=t.due});S.db.sales.filter(x=>!x.cancelled&&!x.invoiceId&&coOk(x)).forEach(x=>{const t=saleTot(x);if(t.due>0.0005&&inM(x.dueDate||x.date))inv+=t.due});
  S.db.payables.filter(coOk).forEach(p=>{const t=payTot(p);if(t.due>0.0005&&inM(p.due||p.date))pay+=t.due});
  S.db.bills.filter(x=>!co||x.companyId===co).forEach(x=>{if(k===0&&x.lastPaid===ym(new Date()))return;bills+=+x.amount});
  const paidSal=S.db.payruns.some(p=>p.posted&&p.month===a.slice(0,7)&&(!co||p.companyId===co))||(k===0&&txF().some(t=>t.category==="رواتب"&&t.date>=a&&t.date<=b));const sal=paidSal?0:payroll;
  const oi=avgIn*frac,oo=avgOut*frac;const inflow=inv+oi,outflow=pay+bills+sal+oo;const opening=bal;bal=bal+inflow-outflow;
  months.push({label:MONTHS[pd(a).getMonth()]+(k===0?" (المتبقي)":""),opening:r3(opening),inv:r3(inv),oi:r3(oi),pay:r3(pay),bills:r3(bills),sal:r3(sal),oo:r3(oo),inflow:r3(inflow),outflow:r3(outflow),closing:r3(bal)})}
 return{open:r3(open),months,hasAcc:!!accs.length}}

function spfRates(){return{omEe:8,omEr:14.5,exEe:0,exEr:1,...(S.db.settings.spf||{})}}
const isOm=e=>e.spfType?e.spfType==="om":/عمان|عُمان|omani/i.test(e.nationality||"");
const empGross=e=>r3((+e.salary||0)+(+e.housing||0)+(+e.transport||0)+(+e.otherAllow||0));
function advBal(empId){const given=S.db.advances.filter(a=>a.empId===empId).reduce((s,a)=>s+ +a.amount,0);const ded=S.db.payruns.filter(p=>p.posted).reduce((s,p)=>s+(p.lines||[]).filter(l=>l.empId===empId).reduce((x,l)=>x+(+l.adv||0),0),0);return r3(given-ded)}
const advInst=empId=>S.db.advances.filter(a=>a.empId===empId).reduce((s,a)=>s+(+a.inst||0),0);
function lineCalc(l){const gross=r3(+l.basic+ +l.allow+(+l.bonus||0));const absDed=r3((+l.basic+ +l.allow)/30*(+l.absent||0));const net=r3(gross-absDed-(+l.ee||0)-(+l.adv||0)-(+l.other||0));return{gross,absDed,net}}
function recomputeSpf(l){const c=lineCalc({...l,ee:0});const base=Math.min(Math.max(c.gross-c.absDed,0),3000);const r=spfRates();l.ee=r3(base*(l.om?r.omEe:r.exEe)/100);l.er=r3(base*(l.om?r.omEr:r.exEr)/100);return l}
function prTot(p){let gross=0,net=0,ee=0,er=0,adv=0;(p.lines||[]).forEach(l=>{const c=lineCalc(l);gross+=c.gross-c.absDed;net+=c.net;ee+=+l.ee||0;er+=+l.er||0;adv+=+l.adv||0});return{gross:r3(gross),net:r3(net),ee:r3(ee),er:r3(er),adv:r3(adv)}}
function unpaidDays(empId,month){const[y,m]=month.split("-").map(Number);const a=ymd(new Date(y,m-1,1)),b=ymd(new Date(y,m,0));return S.db.leaves.filter(l=>l.empId===empId&&l.type==="unpaid"&&l.from<=b&&l.to>=a).reduce((s,l)=>s+Math.round((pd(l.to<b?l.to:b)-pd(l.from>a?l.from:a))/864e5)+1,0)}
function prLine(e,month){const g=empGross(e);return recomputeSpf({empId:e.id,name:e.name,basic:+e.salary||0,allow:r3(g-(+e.salary||0)),bonus:0,absent:unpaidDays(e.id,month),adv:r3(Math.max(0,Math.min(advBal(e.id),advInst(e.id)))),other:0,om:isOm(e)})}
function newPayrun(co,month){const[y,m]=month.split("-").map(Number);const me=ymd(new Date(y,m,0));const emps=S.db.employees.filter(e=>e.companyId===co&&(!e.joinDate||e.joinDate<=me));if(!emps.length)return toast("لا يوجد موظفون في هذه الشركة لهذا الشهر");

function leaveBal(e){if(!e.joinDate)return null;const months=(pd(today())-pd(e.joinDate))/864e5/30.4375;const ent=months<6?0:months/12*30;const taken=S.db.leaves.filter(l=>l.empId===e.id&&l.type==="annual"&&l.from<=today()).reduce((s,l)=>s+ +l.days,0);const bal=ent-taken+(+e.leaveAdj||0);return{ent:Math.floor(ent*10)/10,taken,bal:Math.floor(bal*10)/10,eligible:months>=6}}
const svc=y=>{const yy=Math.floor(y),mm=Math.floor((y-yy)*12);return`${yy} سنة و${mm} شهر`};

 const ev=(uidv,date,sum,desc,alarms,rrule)=>{if(onlyNew&&done.has(uidv))return;uids.push(uidv);L.push("BEGIN:VEVENT","UID:"+uidv+"@idarat-amali","DTSTAMP:"+st,"DTSTART;VALUE=DATE:"+date.replace(/-/g,""),"DTEND;VALUE=DATE:"+addDays(1,date).replace(/-/g,""),"SUMMARY:"+icsEsc(sum),"DESCRIPTION:"+icsEsc(desc));if(rrule)L.push("RRULE:"+rrule);alarms.forEach(a=>L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(sum),"TRIGGER:"+a,"END:VALARM"));L.push("END:VEVENT")};
 const docs=docId?S.db.docs.filter(d=>d.id===docId):S.db.docs;
 docs.filter(d=>d.expiry&&(docId||d.expiry>=addDays(-30))).forEach(d=>ev("doc-"+d.id+"-"+d.expiry,d.expiry,"انتهاء: "+d.type+" — "+ownerLabel(d),[d.number?"الرقم: "+d.number:"","من تطبيق إدارة أعمالي"].filter(Boolean).join("\n"),["-P29DT15H","-P6DT15H","PT9H"]));
 if(!docId){S.db.invoices.filter(i=>i.kind!=="quote"&&!i.cancelled&&i.due&&invTot(i).due>0.0005).forEach(i=>ev("inv-"+i.id+"-"+i.due,i.due,"استحقاق فاتورة "+i.number+" — "+i.client,"المبلغ المتبقي: "+money(invTot(i).due)+" ر.ع",["PT9H"]));
  S.db.payables.filter(p=>p.due&&payTot(p).due>0.0005).forEach(p=>ev("pay-"+p.id+"-"+p.due,p.due,"سداد للمورد: "+p.party,"المبلغ: "+money(payTot(p).due)+" ر.ع",["-P1DT15H"]));
  S.db.bills.forEach(b=>{const d=new Date();const dd=Math.min(+b.dueDay||1,28);ev("bill-"+b.id+"-"+dd,ymd(new Date(d.getFullYear(),d.getMonth(),dd)),"استحقاق: "+b.name,"المبلغ المعتاد: "+money(b.amount)+" ر.ع — "+coName(b.companyId),["-P1DT15H"],"FREQ=MONTHLY;BYMONTHDAY="+dd)})}

const DIGMAP={"٠":"0","١":"1","٢":"2","٣":"3","٤":"4","٥":"5","٦":"6","٧":"7","٨":"8","٩":"9","۰":"0","۱":"1","۲":"2","۳":"3","۴":"4","۵":"5","۶":"6","۷":"7","۸":"8","۹":"9"};
const normDigits=s=>String(s).replace(/[٠-٩۰-۹]/g,c=>DIGMAP[c]);
function parseDocText(raw){const text=normDigits(raw||"");const lines=text.split(/\n+/);const dates=[];const toD=(y,m,d)=>{y=+y;m=+m;d=+d;if(y<1950||y>2100||m<1||m>12||d<1||d>31)return null;return`${y}-${pad(m)}-${pad(d)}`};
 const re=/(\d{4})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{1,2})|(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{4})/g;
 lines.forEach((ln,i)=>{let m;re.lastIndex=0;while((m=re.exec(ln))){const d=m[1]?toD(m[1],m[2],m[3]):toD(m[6],m[5],m[4]);if(d)dates.push({d,ln:ln+" "+(lines[i-1]||"")})}});
 const EXP=/انتهاء|الانتهاء|ينتهي|صالح(ة)?\s*(حتى|لغاية)|الصلاحية|expir|valid\s*(until|till|to|thru)|exp\.?\s*date/i,ISS=/إصدار|الإصدار|اصدار|تاريخ التسجيل|تاريخ القيد|issue|registration date|date of reg/i;
 let expiry=(dates.find(x=>EXP.test(x.ln))||{}).d||null,issue=(dates.find(x=>ISS.test(x.ln)&&x.d!==expiry)||{}).d||null;
 const sorted=[...new Set(dates.map(x=>x.d))].sort();if(!expiry&&sorted.length>=2)expiry=sorted[sorted.length-1];if(!issue&&sorted.length>=2&&sorted[0]!==expiry)issue=sorted[0];if(!expiry&&sorted.length===1&&sorted[0]>today())expiry=sorted[0];
 let number=null;const NUM=/(رقم|No\.?|Number|CR|ID|Civil|Passport|السجل)/i;const strip=s=>s.replace(re," ");
 for(const ln of lines){if(NUM.test(ln)){const m=strip(ln).match(/[A-Z]{0,3}\d{5,12}/);if(m){number=m[0];break}}}
 if(!number){const all=(strip(text).match(/\d{6,12}/g)||[]).sort((a,b)=>b.length-a.length);number=all[0]||null}
 const T=[[/سجل\s*تجاري|السجل التجاري|commercial\s*regist/i,"سجل تجاري"],[/جواز|passport/i,"جواز السفر"],[/مقيم|resident|البطاقة الشخصية|civil\s*(id|number)|identity/i,"البطاقة الشخصية / بطاقة مقيم"],[/القيمة المضافة|\bVAT\b/i,"شهادة ضريبة القيمة المضافة"],[/الضريب|tax\s*(card|registration)/i,"شهادة التسجيل الضريبي"],[/غرفة|chamber/i,"عضوية غرفة التجارة والصناعة"],[/بلدي|municipal/i,"رخصة بلدية"],[/تأمين|insurance/i,"وثيقة تأمين"],[/رخصة\s*(قيادة|سياقة)|driving/i,"رخصة القيادة"],[/تصريح\s*عمل|ملكية|labou?r\s*card|work\s*permit/i,"تصريح العمل (ملكية)"],[/إيجار|ايجار|lease|tenancy/i,"عقد إيجار المقر"]];
 const type=(T.find(([r])=>r.test(text))||[])[1]||null;return{expiry,issue,number,type}}

async function pinPress(k){const l=LK();if(k==="bio")return bioUnlock();if(k==="usebio"){S.lockMode="bio";drawLock();return bioUnlock()}if(k==="usepin"){S.lockMode="pin";S.pinBuf="";return drawLock()}if(k==="forgot")return lockForgot();if(k==="back")return drawLock();if(k==="wipe")return wipeDevice();

const sset=()=>({vatInc:true,vipMin:500,inactiveDays:60,footer:"شكرًا لتسوقكم معنا",acc:{},target:{},...(S.db.settings.sales||{})});

function saleTot(s){const sub=r3((s.items||[]).reduce((a,i)=>a+(+i.qty||0)*(+i.price||0),0));const disc=r3(Math.min(+s.discount||0,sub));const b0=r3(sub-disc);const rr=+s.vatRate||0;const vat=s.vatInc?r3(b0*rr/(100+rr)):r3(b0*rr/100);const total=s.vatInc?b0:r3(b0+vat);const net=r3(total-vat);const cost=r3((s.items||[]).reduce((a,i)=>a+(+i.qty||0)*(+i.cost||0),0));const paid=r3((s.payments||[]).reduce((a,p)=>a+ +p.amount,0));return{sub,disc,vat,total,net,cost,profit:r3(net-cost),paid,due:r3(total-paid)}}
function saleStatus(s){if(s.cancelled)return{k:"cancel",cls:"",txt:"ملغاة"};if(s.invoiceId)return{k:"inv",cls:"info",txt:"تحولت لفاتورة"};const t=saleTot(s);if(t.due<=0.0005)return{k:"paid",cls:"ok",txt:"مدفوعة"};const n=daysTo(s.dueDate);if(s.dueDate&&n<0)return{k:"overdue",cls:"bad",txt:`آجلة متأخرة ${-n} يوم`};return{k:"credit",cls:"warn",txt:s.dueDate?`آجلة، تستحق بعد ${n} يوم`:"آجلة"}}
function nextSaleNo(co){const y=new Date().getFullYear();const re=new RegExp("^S-"+y+"-(\\d+)$");let mx=0;S.db.sales.forEach(s=>{if(s.companyId===co){const m=String(s.number).match(re);if(m)mx=Math.max(mx,+m[1])}});return`S-${y}-${String(mx+1).padStart(5,"0")}`}
function methodAcc(co,m){const map=(sset().acc||{})[co]||{};if(map[m]&&S.db.accounts.some(a=>a.id===map[m]))return map[m];const l=S.db.accounts.filter(a=>a.companyId===co);if(m==="cash")return((l.find(a=>a.kind==="cash")||l.find(a=>a.kind==="bank"))||{}).id||"";return((l.find(a=>a.kind==="bank")||l[0])||{}).id||""}
function addSalePayment(sale,amt,method,date){const t=saleTot(sale);const acc=methodAcc(sale.companyId,method);const tx=upsert("tx",{id:uid(),companyId:sale.companyId,projectId:"",kind:"in",category:"مبيعات",amount:r3(amt),date,note:`بيع ${sale.number} — ${sale.customerName}`,saleId:sale.id,accountId:acc,vat:t.total?r3(amt*t.vat/t.total):0,invoiceId:sale.invoiceId||""});sale.payments=[...(sale.payments||[]),{id:uid(),date,amount:r3(amt),method,accountId:acc,txId:tx.id}];return tx}
const liveSales=(a,b)=>S.db.sales.filter(s=>!s.cancelled&&sOk(s)&&(!a||s.date>=a)&&(!b||s.date<=b));
function custStats(c){const l=S.db.sales.filter(s=>!s.cancelled&&s.customerId===c.id);const tot=l.reduce((a,s)=>a+saleTot(s).total,0);const due=l.filter(s=>!s.invoiceId).reduce((a,s)=>a+Math.max(0,saleTot(s).due),0);const last=l.map(s=>s.date).sort().pop()||"";return{n:l.length,tot:r3(tot),due:r3(due),last,avg:l.length?r3(tot/l.length):0}}
function salesAR(){return S.db.sales.filter(s=>!s.cancelled&&!s.invoiceId&&coOk(s)).map(s=>({i:{id:s.id,client:s.customerName,number:s.number,due:s.dueDate,date:s.date},t:{due:saleTot(s).due},s:saleStatus(s),sale:true})).filter(x=>x.t.due>0.0005)}
function lowStock(){return S.db.products.filter(p=>sOk(p)&&p.active!==false&&isLow(p))}
function sBars(bk,label){const W=640,H=200,L=50,R=8,T=10,B=26;const mx=niceMax(Math.max(...bk.map(b=>b.v),1));const iw=W-L-R,ih=H-T-B,bw=iw/bk.length;const step=Math.ceil(bk.length/12);
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label||"المبيعات")}" style="direction:ltr">`;for(let k=0;k<=4;k++){const v=mx*k/4,y=T+ih-ih*k/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v>=1000?(v/1000).toLocaleString("en-US",{maximumFractionDigits:1})+"k":Math.round(v)}</text>`}
 bk.forEach((b,i)=>{const h=ih*b.v/mx,x=L+i*bw+bw*.14;s+=`<rect x="${x}" y="${T+ih-h}" width="${bw*.72}" height="${Math.max(h,0)}" rx="2" fill="var(--brand)"${i===bk.length-1?"":' opacity=".75"'}><title>${esc(b.l)}: ${money(b.v)}</title></rect>${i%step===0||i===bk.length-1?`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(b.l)}</text>`:""}`});return s+"</svg>"}
const rowsBar=(arr,fmt)=>{const mx=Math.max(...arr.map(x=>x[1]),1);return arr.map(([k,v,sub])=>`<div style="margin-bottom:10px"><div class="row" style="font-size:13.5px"><span style="min-width:0;overflow-wrap:anywhere">${esc(k)}</span><span class="sp"></span>${fmt?fmt(v):M(v)}</div>${sub?`<div class="muted" style="font-size:12px">${sub}</div>`:""}<div class="bar"><i style="width:${v/mx*100}%"></i></div></div>`).join("")};
function sHead(title,sub,btns){return`${demoBar()}<div class="page-h"><div><h1>${title}</h1><p>${sub}</p></div><span class="sp"></span>${btns||""}</div>`}

 const prod={};l.forEach(s=>s.items.forEach(i=>{const p=prod[i.name]||(prod[i.name]={q:0,r:0,pr:0});p.q+=+i.qty;p.r+=i.qty*i.price;p.pr+=i.qty*(i.price-(+i.cost||0))}));

/* bundles */
function bundleCost(p){return r3((p.components||[]).reduce((a,c)=>{const q=prodById(c.productId);return a+(q?(+q.cost||0)*c.qty:0)},0))}
function bundleList(p){return r3((p.components||[]).reduce((a,c)=>{const q=prodById(c.productId);return a+(q?(+q.price||0)*c.qty:0)},0))}
function bundleAvail(p){const cs=(p.components||[]).map(c=>[prodById(c.productId),c.qty]).filter(x=>x[0]&&x[0].track!=="no");if(!(p.components||[]).length)return 0;if(!cs.length)return Infinity;return Math.max(0,Math.min(...cs.map(([q,n])=>Math.floor((+q.stock||0)/n))))}
function stockMove(it,sign){const p=prodById(it.productId);if(!p)return[];const low=[];const mv=(q,n)=>{if(q.track==="no"||q.track==="bundle")return;q.stock=r3((+q.stock||0)+sign*n);q.u=now();if(sign<0&&q.stock<=(+q.minStock||0))low.push(q.name)};if(p.track==="bundle")(p.components||[]).forEach(c=>{const q=prodById(c.productId);if(q)mv(q,it.qty*c.qty)});else mv(p,it.qty);return low}
const isLow=p=>p.track!=="no"&&p.track!=="bundle"&&(+p.stock||0)<=(+p.minStock||0);
function stockLabel(p){if(p.track==="no")return"خدمة";if(p.track==="bundle"){const a=bundleAvail(p);return"باقة · متاح "+(isFinite(a)?a:"")}return"المخزون: "+(+p.stock||0)+" "+esc(p.unit||"")}
function prodPill(p){const pr=+p.price>0?"":`<span class="pill bad">بدون سعر</span>`;if(p.track==="no")return pr+`<span class="pill">خدمة</span>`;if(p.track==="bundle"){const a=bundleAvail(p);return pr+`<span class="pill ${a<1?"bad":"info"}">باقة · ${isFinite(a)?a:"متاح"}</span>`}return pr+`<span class="pill ${isLow(p)?"bad":"ok"}">${+p.stock||0} ${esc(p.unit||"")}</span>`}

 case"payBill":(async()=>{const b=S.db.bills.find(x=>x.id===ds.id);upsert("tx",{id:uid(),companyId:b.companyId,kind:"out",category:b.category,amount:+b.amount,date:today(),note:b.name+" — "+MONTHS[new Date().getMonth()],projectId:""});b.lastPaid=ym(new Date());b.u=now();await save();render();toast("تم تسجيل السداد")})();break;

 case"per":S.f.per=ds.v;render();break;

 case"help":openHelp(baseHelpKey(S.view));break;
 case"helpKey":openHelp(ds.k);break;
 case"hideTip":S.local.tips={...(S.local.tips||{}),[ds.v]:1};saveLocal();render();toast("يمكنك دائمًا الضغط على ؟ أعلى الشاشة لشرح أي صفحة",3500);break;
 case"tour":showTour();break;
 case"openProj":S.f.proj=ds.id;if(S.view==="proj"){S.anim="fade";render();window.scrollTo(0,0)}else go("proj");break;
 case"scopeTo":S.local.co=ds.v;saveLocal();if(ds.to&&ds.to!==S.view)go(ds.to);else{S.anim="fade";render()}toast("تعرض الآن: "+scopeName()+". اختر «كل الشركات والمشاريع» من الأعلى لعرض الكل.",3800);break;
 case"scopeAll":S.local.co="all";saveLocal();S.anim="fade";render();break;

 case"about":modal(aboutPanel().replace('class="panel about"','class="about"')+`<div class="row-end"><span class="sp"></span><button class="btn primary" data-act="close">إغلاق</button></div>`);break;
 case"featGo":closeModal();{const f=FEAT[ds.k];if(f.view&&f.view!==S.view)go(f.view);if(f.act)setTimeout(()=>act(f.act,{kind:f.kind||""}),60)}break;
 case"newLib":formLib();break;case"editLib":formLib(S.db.files.find(x=>x.id===ds.id));break;case"openLib":openLib(ds.id);break;

 case"shareFolder":(async()=>{const list=S.db.files.filter(x=>(x.folderId||"")===(S.f.files.folder||"")&&coOkLoose(x));const files=[];for(const f of list){const b=S.blobs[f.meta.id]||await getBlob(f.meta.id);if(b)files.push(new File([b],libFileName(f,b),{type:b.type}))}if(!files.length)return toast("لا توجد ملفات في هذا المجلد");shareSheet(folderName(S.f.files.folder)||"ملفاتي",list.map(f=>"• "+f.name).join("\n"),files)})();break;
 case"gToggle":{const g={...(S.db.settings.guide||{})};g[ds.id]=!g[ds.id];S.db.settings={...S.db.settings,guide:g,u:now()};save();render();if(g[ds.id]){const n=Object.values(g).filter(Boolean).length;toast(n>=GUIDE.length?"أحسنت! أنهيت كل خطوات التأسيس.":`ممتاز، أنجزت ${n} من ${GUIDE.length}. افتح الخطوة التالية.`,3200)}break}
 case"gSector":S.db.settings={...S.db.settings,sector:ds.v,u:now()};save();render();break;
 case"gDoc":formDoc({type:ds.type,ownerType:ds.owner||"company"});break;
 case"refresh":doRefresh();break;
 case"doShare":{const d=S.shareData;if(d)share(d).then(ok=>{if(ok)closeModal()});break}

 case"shareFile":(async()=>{const d=S.db.docs.find(x=>x.id===ds.doc);const f=d.files.find(x=>x.id===ds.id);const b=S.blobs[f.id]||await getBlob(f.id);if(!b)return toast("المرفق غير موجود");const file=new File([b],fileName(f,b),{type:b.type});shareSheet(d.type,docText(d),[file])})();break;
 case"shareEmp":(async()=>{const e=S.db.employees.find(x=>x.id===ds.id);const docs=S.db.docs.filter(d=>d.ownerType==="employee"&&d.ownerId===e.id);const files=await docFiles(docs);shareSheet("ملف "+e.name,["ملف الموظف: "+e.name,e.job?"الوظيفة: "+e.job:"","الشركة: "+coName(e.companyId),"",...docs.map(d=>"• "+d.type+(d.number?" ("+d.number+")":"")+(d.expiry?" — ينتهي "+d.expiry:""))].filter(x=>x!=="").join("\n"),files)})();break;
 case"shareList":(async()=>{const docs=(S.docList||[]).filter(d=>(d.files||[]).length);const files=await docFiles(docs);shareSheet("مستندات",docs.map(d=>"• "+ownerLabel(d)+" — "+d.type+(d.expiry?" (ينتهي "+d.expiry+")":"")).join("\n"),files)})();break;
 case"shareReport":{const per=S.f.per||"month";const bk=buckets(per);const cur=bk[bk.length-1];const rows=txF().filter(t=>t.date>=bk[0].a&&t.date<=cur.b).sort((a,b)=>a.date.localeCompare(b.date));
   const csv="\ufeff"+["التاريخ,النوع,التصنيف,المبلغ,الشركة,المشروع,البيان",...rows.map(t=>[t.date,t.kind==="in"?"دخل":t.kind==="tr"?"تحويل":"مصروف",t.category,(+t.amount).toFixed(3),coName(t.companyId),(S.db.projects.find(p=>p.id===t.projectId)||{}).name||"",t.note||""].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(","))].join("\n");
   const file=new File([csv],"تقرير-مالي-"+today()+".csv",{type:"text/csv"});
   const text=["تقرير إدارة أعمالي — "+today(),...bk.map(b=>`${b.l}: دخل ${money(b.i)} | مصروف ${money(b.o)} | صافي ${money(b.n)}`)].join("\n");
   shareSheet("التقرير المالي",text,[file]);break}
 case"copyReport":{const per=S.f.per||"month";const bk=buckets(per);copyText(["تقرير إدارة أعمالي — "+today(),...bk.map(b=>`${b.a}${b.a!==b.b?" → "+b.b:""}: دخل ${money(b.i)} | مصروف ${money(b.o)} | صافي ${money(b.n)}`)].join("\n"));break}
 case"clearDemo":ask("حذف كل البيانات التجريبية والبدء ببياناتك؟",async()=>{COLL.forEach(c=>S.db[c].filter(x=>String(x.id).startsWith("demo-")).forEach(x=>remove(c,x.id)));delete S.db.demo;S.db.settings={...S.db.settings,guide:{},u:now()};S.db.log=[];S.local.co="all";await save();await saveLocal();closeModal();S.view="prefs";render();toast("ابدأ بإضافة شركتك")},"حذف");break;

 case"syncBtn":if(S.sync.connected)syncNow(false);else{S.view="prefs";render()}break;
 case"disconnect":(async()=>{S.sync.connected=false;S.token=null;await saveLocal();setSync("off");render();toast("تم فصل المزامنة على هذا الجهاز")})();break;
