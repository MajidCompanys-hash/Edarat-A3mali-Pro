 ${cats.length>1?`<div class="chips"><button class="chip${!S.c?" on":""}" data-a="cat" data-v="">${t("all")}</button>${cats.map(x=>`<button class="chip${S.c===x?" on":""}" data-a="cat" data-v="${esc(x)}">${esc(cname(x))}</button>`).join("")}</div>`:""}</div></div>
 <main class="wrap">${S.last&&!tt.n?`<div class="reorder"><span class="sp">${t("last")}: <b class="num">${esc(S.last.number)}</b> · ${money(S.last.total)}</span><button class="hb" style="color:var(--ink);border-color:var(--accent)" data-a="repeat">${t("repeat")}</button></div>`:""}
 ${list.length?`<div class="grid ${view}" style="margin-top:14px">${list.map(card).join("")}</div>`:`<div class="empty">${t("empty")}</div>`}
 <footer>${c.updated?`${t("updated")}: <span class="num">${new Date(c.updated).toLocaleDateString(S.lang==="en"?"en-GB":"ar-OM")}</span>`:""}</footer></main>
 ${tt.n?`<div class="bar"><button data-a="cart"><span><span class="badge num">${tt.l.length}</span> ${t("review")}</span><span>${money(tt.sub)}</span></button></div>`:""}`;}
function card(p){const hasPiece=+p.piecePrice>0;const m=S.modes[p.id]||"pack";const k=ck(p.id,hasPiece?m:"pack");const q=S.cart[k]||0;const price=hasPiece&&m==="piece"?p.piecePrice:p.price;const unit=hasPiece&&m==="piece"?(p.pieceUnit||t("piece")):(p.unit||"");
 return`<div class="card${p.out?" dis":""}"><div class="ph">${p.img?`<img src="${p.img}" alt="" loading="lazy">`:esc(pname(p).trim()[0]||"؟")}</div><div class="cb"><div class="info"><div class="pn">${esc(pname(p))}</div><div class="pu">${esc(un(unit))}${hasPiece&&m==="pack"&&p.packQty?" · "+p.packQty+" "+esc(un(p.pieceUnit||t("piece"))):""}</div><div class="pr">${money(price)}</div></div><div class="act">
 ${hasPiece&&!p.out?`<div class="mode"><button data-a="mode" data-id="${p.id}" data-v="pack" class="${m==="pack"?"on":""}">${esc(un(p.unit)||t("pack"))}</button><button data-a="mode" data-id="${p.id}" data-v="piece" class="${m==="piece"?"on":""}">${esc(un(p.pieceUnit||t("piece")))}</button></div>`:""}
 ${p.out?`<div class="out">${t("out")}</div>`:q?`<div class="step"><button data-a="dec" data-k="${k}" aria-label="-">−</button><input class="qin num" data-k="${k}" type="number" inputmode="numeric" value="${q}" aria-label="qty"><button data-a="inc" data-k="${k}" aria-label="+">+</button></div>`:`<button class="add" data-a="inc" data-k="${k}">${t("add")}</button>`}</div></div></div>`}
function openCart(){const c=S.cat;const tt=totals();if(!tt.n){closeS();draw();return}const min=+c.minOrder||0;const pays=c.pay&&c.pay.length?c.pay:["cash"];const areas=c.areas||[];
 sheet(`<div style="display:flex;align-items:center"><h2 class="sp">${t("cart")}</h2><button class="hb" style="color:var(--ink);border-color:var(--line)" data-a="close">${t("close")}</button></div>
 <div>${tt.l.map(x=>`<div class="line"><div class="t"><b>${esc(pname(x.p))}</b><span>${esc(un(x.unit))} · ${money(x.price)}</span></div><div class="step"><button data-a="dec" data-k="${x.k}">−</button><input class="qin num" data-k="${x.k}" type="number" inputmode="numeric" value="${x.qty}"><button data-a="inc" data-k="${x.k}">+</button></div></div>`).join("")}</div>
 ${min&&tt.sub<min?`<div><div class="note">${t("remain").replace("{x}",money(min-tt.sub))}</div><div class="prog"><i style="width:${tt.sub/min*100}%"></i></div></div>`:""}
 <h3>${t("info")}</h3>
 <div class="fld"><label for="f_shop">${t("shop")}</label><input id="f_shop" value="${esc(S.me.shop||"")}" autocomplete="organization"></div>
 <div class="two"><div class="fld"><label for="f_name">${t("name")} *</label><input id="f_name" value="${esc(S.me.name||"")}" autocomplete="name"></div><div class="fld"><label for="f_phone">${t("phone")} *</label><input id="f_phone" type="tel" inputmode="tel" value="${esc(S.me.phone||"")}" autocomplete="tel" dir="ltr"></div></div>
 ${areas.length?`<div class="fld"><label for="f_area">${t("area")} *</label><select id="f_area"><option value="">${t("chooseArea")}</option>${areas.map(a=>`<option value="${esc(a.name)}"${S.me.area===a.name?" selected":""}>${esc(aname(a))} — ${+a.fee?money(a.fee).replace(/<[^>]+>/g,""):t("free")}${+a.freeOver?" ("+t("free")+" ≥ "+r3(a.freeOver)+")":""}</option>`).join("")}</select></div>`:""}
 <div class="fld"><label for="f_addr">${t("address")}</label><input id="f_addr" value="${esc(S.me.address||"")}" autocomplete="street-address"></div>
 <div class="fld"><label>${t("pay")}</label><div class="pays">${pays.map((p,i)=>`<label><input type="radio" name="pay" value="${p}"${(S.me.pay||pays[0])===p?" checked":""}> ${t(p)}</label>`).join("")}</div></div>
 <div class="fld"><label for="f_notes">${t("notes")}</label><textarea id="f_notes" rows="2">${esc(S.me.notes||"")}</textarea></div>
 <label style="display:flex;gap:8px;align-items:center;font-size:13.5px"><input id="f_rem" type="checkbox" ${S.me.rem!==false?"checked":""}> ${t("remember")}</label>
 <div class="tot" id="tot">${totHTML()}</div><div id="msg"></div>
 <button class="btn" data-a="send" ${min&&tt.sub<min?"disabled":""}>${t("send")} · ${money(tt.total)}</button>`)}
function totHTML(){const tt=totals();return`<span>${t("sub")}</span><span>${money(tt.sub)}</span>${(S.cat.areas||[]).length?`<span>${t("fee")}</span><span>${S.me.area?(tt.fee?money(tt.fee):t("free")):"—"}</span>`:""}<span class="g">${t("total")}</span><span class="g">${money(tt.total)}</span>`}
function readMe(){const g=id=>{const e=$("#"+id);return e?e.value.trim():""};const pay=document.querySelector("input[name=pay]:checked");S.me={...S.me,shop:g("f_shop"),name:g("f_name"),phone:g("f_phone"),area:$("#f_area")?$("#f_area").value:S.me.area,address:g("f_addr"),notes:g("f_notes"),pay:pay?pay.value:S.me.pay,rem:$("#f_rem")?$("#f_rem").checked:true}}
function saveMe(){if(S.me.rem!==false)store.set("me",{...S.me,notes:""});else store.set("me",{})}
function waText(o){const c=S.cat;const L=[(S.lang==="en"?"New order — ":"طلب جديد — ")+sname(),(S.lang==="en"?"Order no: ":"رقم الطلب: ")+(o.number||"—"),new Date().toLocaleString(S.lang==="en"?"en-GB":"ar-OM"),"",(o.shop?(S.lang==="en"?"Shop: ":"المحل: ")+o.shop+"\n":"")+(S.lang==="en"?"Name: ":"الاسم: ")+o.name,(S.lang==="en"?"Phone: ":"الهاتف: ")+o.phone];if(o.area)L.push((S.lang==="en"?"Area: ":"المنطقة: ")+aname((c.areas||[]).find(a=>a.name===o.area)||{name:o.area}));if(o.address)L.push((S.lang==="en"?"Address: ":"العنوان: ")+o.address);L.push("",...o.items.map((i,n)=>`${n+1}) ${i.name} — ${i.qty} ${un(i.unit)} × ${(+i.price).toFixed(3)} = ${(i.qty*i.price).toFixed(3)}`),"",`${t("sub")}: ${(+o.subtotal).toFixed(3)}`);if(o.fee)L.push(`${t("fee")}: ${(+o.fee).toFixed(3)}`);L.push(`${t("total")}: ${(+o.total).toFixed(3)} ${t("cur")}`,`${t("pay")}: ${t(o.pay)}`);if(o.notes)L.push(`${t("notes")}: ${o.notes}`);return L.join("\n")}
function waLink(o){let d=String(S.cat.wa||"").replace(/\D/g,"");if(d.length===8)d="968"+d;return`https://wa.me/${d}?text=${encodeURIComponent(waText(o))}`}
async function send(){readMe();const tt=totals();const msg=$("#msg");msg.innerHTML="";
 if(!S.me.name||S.me.phone.replace(/\D/g,"").length<7){msg.innerHTML=`<div class="err">${t("req")}</div>`;return}
 if((S.cat.areas||[]).length&&!S.me.area){msg.innerHTML=`<div class="err">${t("reqArea")}</div>`;return}
 saveMe();const b=$("[data-a=send]");b.disabled=true;b.textContent=t("sending");const sig=JSON.stringify([S.cart,S.me]);let pend=store.get("pend",null);if(!pend||pend.sig!==sig){pend={sig,cid:Date.now().toString(36)+Math.random().toString(36).slice(2,10)};store.set("pend",pend)}
 const order={shop:S.me.shop,name:S.me.name,phone:S.me.phone,area:S.me.area||"",address:S.me.address,notes:S.me.notes,pay:S.me.pay||(S.cat.pay||["cash"])[0],lang:S.lang,cid:pend.cid,items:tt.l.map(x=>({id:x.id,mode:x.mode,qty:x.qty}))};
 const local={...order,items:tt.l.map(x=>({name:pname(x.p),unit:x.unit,qty:x.qty,price:x.price})),subtotal:tt.sub,fee:tt.fee,total:tt.total};
 try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"order",order})});const j=await r.json();
  if(!j.ok){if(j.error==="items"){store.set("pend",null);await load(true);openCart();const m=$("#msg");if(m)m.innerHTML=`<div class="err">${t("allOut")}</div>`;else sheet(`<p class="center">${t("allOut")}</p><button class="btn sec" data-a="close">OK</button>`);return}const e=j.error==="min"?t("minErr"):j.error==="area"?t("areaErr"):j.error==="contact"?t("req"):t("fail");b.disabled=false;b.innerHTML=`${t("send")} · ${money(tt.total)}`;msg.innerHTML=`<div class="err">${e}</div>`;return}
  const done={...local,number:j.number,subtotal:j.subtotal,fee:j.fee,total:j.total,items:j.items.map(i=>({name:(S.lang==="en"&&(S.cat.products.find(p=>p.id===i.id)||{}).nameEn)||i.name,unit:i.unit,qty:i.qty,price:i.price}))};
  S.last={number:j.number,total:j.total,cart:{...S.cart}};store.set("last",S.last);store.set("pend",null);S.cart={};saveCart();const skip=(j.skipped||[]).length?`<div class="err">${t("skipped")}: ${esc(j.skipped.map(n=>{const p=S.cat.products.find(x=>x.name===n);return p?pname(p):n}).join("، "))}</div>`:"";
  sheet(`<div class="ok-ico">${I.ok}</div><h2 class="center">${t("done")}</h2><p class="center note" style="margin:0">${t("doneSub")}</p><div class="center"><div class="note">${t("num")}</div><div class="num" style="font-family:var(--fd);font-size:24px;font-weight:700">${esc(j.number)}</div><div>${money(j.total)}</div></div>${skip}${S.cat.wa?`<a class="btn wa center" style="text-decoration:none" href="${waLink(done)}" target="_blank" rel="noopener">${t("waCopy")}</a>`:""}<button class="btn sec" data-a="close">${t("newOrder")}</button>`)}
 catch(e){b.disabled=false;b.innerHTML=`${t("send")} · ${money(tt.total)}`;msg.innerHTML=`<div class="err">${t("fail")}</div><div class="note">${t("failSub")}</div>${S.cat.wa?`<a class="btn wa center" style="text-decoration:none;display:block;margin-top:8px" href="${waLink(local)}" target="_blank" rel="noopener">${t("waOnly")}</a>`:""}`}}
function sheet(h){closeS();const s=document.createElement("div");s.className="scrim";s.id="scrim";s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${h}</div>`;s.addEventListener("click",e=>{if(e.target===s){readMe();closeS();draw()}});document.body.appendChild(s)}
function closeS(){const s=$("#scrim");if(s)s.remove()}
function bump(k,d){S.cart[k]=Math.max(0,(+S.cart[k]||0)+d);saveCart()}
function refresh(){if($("#scrim")&&$("#tot")){readMe();openCart()}else draw()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
 if(a==="inc"){bump(b.dataset.k,1);refresh()}else if(a==="dec"){bump(b.dataset.k,-1);refresh()}
 else if(a==="mode"){S.modes[b.dataset.id]=b.dataset.v;draw()}else if(a==="view"){S.view=b.dataset.v;store.set("view",S.view);draw()}
 else if(a==="cat"){S.c=b.dataset.v;draw()}else if(a==="lang"){S.lang=S.lang==="ar"?"en":"ar";store.set("lang",S.lang);draw()}
 else if(a==="cart")openCart();else if(a==="close"){if($("#tot"))readMe();closeS();draw()}else if(a==="send")send();
 else if(a==="repeat"&&S.last){S.cart={...S.last.cart};saveCart();draw();openCart()}});
document.addEventListener("input",e=>{const x=e.target;if(x.id==="q"){S.q=x.value;const pos=x.selectionStart;draw();const n=$("#q");n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}});
document.addEventListener("change",e=>{const x=e.target;if(x.classList.contains("qin")){S.cart[x.dataset.k]=Math.max(0,Math.floor(+x.value||0));saveCart();refresh()}else if(x.id==="f_area"){S.me.area=x.value;$("#tot").innerHTML=totHTML();const b=$("[data-a=send]");if(b)b.innerHTML=`${t("send")} · ${money(totals().total)}`}});
document.addEventListener("gesturestart",e=>e.preventDefault());
(()=>{let last=0;document.addEventListener("touchend",e=>{const n=Date.now();if(n-last<320&&!e.target.closest("input,textarea,select,button,a,label,[data-a]"))e.preventDefault();last=n},{passive:false});document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});document.addEventListener("wheel",e=>{if(e.ctrlKey)e.preventDefault()},{passive:false})})();
/* phone back closes the open sheet instead of leaving the catalog */
(()=>{let mh=false;const _s=sheet,_c=closeS;let inS=0,skip=0;sheet=function(h){inS=1;let r;try{r=_s(h)}finally{inS=0}if(!mh&&!skip){try{history.pushState({sh:1},"");mh=true}catch(e){}}return r};closeS=function(){const had=!!document.getElementById("scrim");_c();if(inS)return;if(had&&mh&&!closeS.pop){mh=false;skip=1;try{history.back()}catch(e){skip=0}}};
 window.addEventListener("popstate",()=>{if(skip){skip=0;if(document.getElementById("scrim")&&!mh){try{history.pushState({sh:1},"");mh=true}catch(e){}}return}if(document.getElementById("scrim")){mh=false;closeS.pop=true;try{if($("#tot"))readMe();closeS();draw()}finally{closeS.pop=false}}else mh=false});
 document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.getElementById("scrim")){if($("#tot"))readMe();closeS();draw()}})})();
load();
}
</script>
